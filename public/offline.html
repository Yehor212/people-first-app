<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4a9d7c">
  <meta property="og:image" content="https://yehor212.github.io/people-first-app/og-image.png">
  <meta name="twitter:image" content="https://yehor212.github.io/people-first-app/og-image.png">
      <link rel="icon" type="image/png" sizes="16x16" href="/people-first-app/favicon-16.png?v=zenflow-browser-leaf-20260804-r8">
      <link rel="icon" type="image/png" sizes="32x32" href="/people-first-app/favicon-32.png?v=zenflow-browser-leaf-20260804-r8">
      <link rel="icon" type="image/png" sizes="48x48" href="/people-first-app/favicon-48.png?v=zenflow-browser-leaf-20260804-r8">
      <link rel="icon" type="image/png" sizes="64x64" href="/people-first-app/favicon-64.png?v=zenflow-browser-leaf-20260804-r8">
  <link rel="icon" href="/people-first-app/favicon.ico?v=zenflow-browser-leaf-20260804-r8" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/people-first-app/pwa-192.png?v=zenflow-browser-leaf-20260804-r8">
  <link rel="apple-touch-icon" href="/people-first-app/apple-touch-icon.png?v=zenflow-browser-leaf-20260804-r8">
  <title>Offline - ZenFlow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg, linear-gradient(135deg, hsl(158, 30%, 56%) 0%, hsl(158, 35%, 45%) 100%));
      color: var(--fg, hsl(0, 0%, 100%));
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      text-align: center;
    }
    .container { width: min(100%, 440px); }
    .brand-logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
      box-shadow: 0 18px 46px rgba(9, 70, 52, 0.28);
    }
    @media (prefers-reduced-motion: reduce) {
      .brand-logo { animation: none; }
      .btn { transition: none; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 16px; opacity: 0.9; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      min-height: 44px;
      min-width: 44px;
      background: hsla(0, 0%, 100%, 0.2);
      border: 2px solid currentColor;
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }
    .btn:hover { background: hsla(0, 0%, 100%, 0.35); }
    .btn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    @media (forced-colors: active) {
      body { background: Canvas; color: CanvasText; }
      .brand-logo { box-shadow: none; }
      .btn { background: Canvas; color: ButtonText; }
    }
  </style>
</head>
<body>
  <main class="container">
    <img class="brand-logo" src="/people-first-app/pwa-192.png?v=zenflow-browser-leaf-20260804-r8" width="96" height="96" alt="" aria-hidden="true">
    <h1 id="offline-title">You are offline</h1>
    <p id="offline-desc">ZenFlow couldn’t open this page without a connection. Reconnect, then try again.</p>
    <button class="btn" onclick="window.location.reload();" id="offline-retry" aria-label="Try again">Try again</button>
  </main>
  <script>
    // Read the app's JSON-encoded preference while retaining compatibility
    // with older plain-string language values.
    try {
      var supported = ['en', 'uk', 'es', 'de', 'fr', 'ja', 'ar', 'he'];
      var stored = localStorage.getItem('zenflow-language');
      var storedLanguage = stored;
      if (stored !== null) {
        try { storedLanguage = JSON.parse(stored); } catch (_) { /* legacy plain string */ }
      }
      var preferredLanguage = stored !== null && typeof storedLanguage !== 'string'
        ? 'en'
        : (typeof storedLanguage === 'string'
          ? storedLanguage
          : ((navigator.languages && navigator.languages[0]) || navigator.language || 'en'));
      var candidate = preferredLanguage.toLowerCase().split('-')[0];
      var lang = supported.indexOf(candidate) >= 0 ? candidate : 'en';
      var t = {
        en: { pageTitle: 'Offline - ZenFlow', title: 'You are offline', desc: 'ZenFlow couldn’t open this page without a connection. Reconnect, then try again.', btn: 'Try again' },
        uk: { pageTitle: 'Немає з’єднання — ZenFlow', title: 'Немає з’єднання', desc: 'ZenFlow не вдалося відкрити цю сторінку без з’єднання. Відновіть підключення та спробуйте ще раз.', btn: 'Повторити' },
        es: { pageTitle: 'Sin conexión - ZenFlow', title: 'Estás sin conexión', desc: 'ZenFlow no pudo abrir esta página sin conexión. Vuelve a conectarte e inténtalo de nuevo.', btn: 'Reintentar' },
        de: { pageTitle: 'Offline – ZenFlow', title: 'Du bist offline', desc: 'ZenFlow konnte diese Seite ohne Verbindung nicht öffnen. Stelle die Verbindung wieder her und versuche es erneut.', btn: 'Erneut versuchen' },
        fr: { pageTitle: 'Hors ligne – ZenFlow', title: 'Vous êtes hors ligne', desc: 'ZenFlow n’a pas pu ouvrir cette page sans connexion. Reconnectez-vous, puis réessayez.', btn: 'Réessayer' },
        ja: { pageTitle: 'オフライン - ZenFlow', title: 'オフラインです', desc: '接続がないため、このページを開けませんでした。再接続してから、もう一度お試しください。', btn: '再試行' },
        ar: { pageTitle: 'غير متصل - ZenFlow', title: 'أنت غير متصل', desc: 'تعذّر على ZenFlow فتح هذه الصفحة دون اتصال. أعد الاتصال ثم حاول مرة أخرى.', btn: 'إعادة المحاولة' },
        he: { pageTitle: 'אין חיבור – ZenFlow', title: 'אין חיבור', desc: 'ZenFlow לא הצליחה לפתוח את הדף הזה ללא חיבור. התחברו מחדש ונסו שוב.', btn: 'ניסיון חוזר' }
      };
      var msgs = t[lang];
      document.title = msgs.pageTitle;
      document.getElementById('offline-title').textContent = msgs.title;
      document.getElementById('offline-desc').textContent = msgs.desc;
      document.getElementById('offline-retry').textContent = msgs.btn;
      document.getElementById('offline-retry').setAttribute('aria-label', msgs.btn);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' || lang === 'he' ? 'rtl' : 'ltr';
    } catch(e) { /* fallback to English */ }

    window.addEventListener('online', function() {
      setTimeout(function() { window.location.reload(); }, 500);
    });
  </script>
</body>
</html>
