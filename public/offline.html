<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4a9d7c">
  <meta property="og:image" content="https://yehor212.github.io/people-first-app/og-image.png">
  <meta name="twitter:image" content="https://yehor212.github.io/people-first-app/og-image.png">
      <link rel="icon" type="image/png" sizes="16x16" href="/people-first-app/favicon-16.png?v=zenflow-browser-leaf-20260627-r7">
      <link rel="icon" type="image/png" sizes="32x32" href="/people-first-app/favicon-32.png?v=zenflow-browser-leaf-20260627-r7">
      <link rel="icon" type="image/png" sizes="48x48" href="/people-first-app/favicon-48.png?v=zenflow-browser-leaf-20260627-r7">
      <link rel="icon" type="image/png" sizes="64x64" href="/people-first-app/favicon-64.png?v=zenflow-browser-leaf-20260627-r7">
  <link rel="icon" href="/people-first-app/favicon.ico?v=zenflow-browser-leaf-20260627-r7" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/people-first-app/pwa-192.png?v=zenflow-browser-leaf-20260627-r7">
  <link rel="apple-touch-icon" href="/people-first-app/apple-touch-icon.png?v=zenflow-browser-leaf-20260627-r7">
  <title>Offline - ZenFlow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg, linear-gradient(135deg, hsl(158, 30%, 56%) 0%, hsl(158, 35%, 45%) 100%));
      color: var(--fg, hsl(0, 0%, 100%));
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .container { max-width: 400px; }
    .brand-logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
      box-shadow: 0 18px 46px rgba(9, 70, 52, 0.28);
    }
    @media (prefers-reduced-motion: reduce) {
      .brand-logo { animation: none; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 16px; opacity: 0.9; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      min-height: 44px;
      min-width: 44px;
      background: hsla(0, 0%, 100%, 0.2);
      border: 2px solid currentColor;
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
      cursor: pointer;
    }
    .btn:hover { background: hsla(0, 0%, 100%, 0.35); }
    .btn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="container" role="main">
    <img class="brand-logo" src="/people-first-app/pwa-192.png?v=zenflow-browser-leaf-20260627-r7" width="96" height="96" alt="" aria-hidden="true">
    <h1 id="offline-title">You are offline</h1>
    <p id="offline-desc">ZenFlow works in offline mode. All your data is saved locally and will sync when you reconnect.</p>
    <button class="btn" onclick="window.location.reload();" id="offline-retry" aria-label="Try again">Try again</button>
  </div>
  <script>
    // Detect language from localStorage (same key as app uses)
    try {
      var lang = localStorage.getItem('zenflow-language') || navigator.language.slice(0, 2);
      var t = {
        en: { title: 'You are offline', desc: 'ZenFlow works in offline mode. All your data is saved locally and will sync when you reconnect.', btn: 'Try again' },
        uk: { title: 'Ви офлайн', desc: 'ZenFlow працює в автономному режимі. Усі ваші дані збережені локально та синхронізуються після підключення.', btn: 'Повторити з'єднання' },
        es: { title: 'Estás sin conexión', desc: 'ZenFlow funciona sin conexión. Todos tus datos se guardan localmente y se sincronizarán cuando vuelvas a conectarte.', btn: 'Reintentar conexión' },
        de: { title: 'Du bist offline', desc: 'ZenFlow funktioniert offline. Alle Daten werden lokal gespeichert und synchronisiert, sobald du wieder verbunden bist.', btn: 'Verbindung erneut versuchen' },
        fr: { title: 'Vous êtes hors ligne', desc: 'ZenFlow fonctionne hors ligne. Toutes vos données sont enregistrées localement et se synchroniseront à la reconnexion.', btn: 'Réessayer la connexion' },
        ja: { title: 'オフラインです', desc: 'ZenFlowはオフラインでも動作します。すべてのデータは端末に保存され、再接続時に同期されます。', btn: '再接続' },
        ar: { title: 'أنت غير متصل', desc: 'يعمل ZenFlow دون اتصال. تُحفظ كل بياناتك محليًا وتتم مزامنتها عند إعادة الاتصال.', btn: 'إعادة محاولة الاتصال' },
        he: { title: 'את/ה אופליין', desc: 'ZenFlow עובד גם ללא חיבור. כל הנתונים שלך נשמרים מקומית ויסונכרנו כשתתחבר/י מחדש.', btn: 'נסה חיבור מחדש' }
      };
      var msgs = t[lang] || t.en;
      document.getElementById('offline-title').textContent = msgs.title;
      document.getElementById('offline-desc').textContent = msgs.desc;
      document.getElementById('offline-retry').textContent = msgs.btn;
      document.getElementById('offline-retry').setAttribute('aria-label', msgs.btn);
      document.documentElement.lang = lang;
      if (lang === 'ar' || lang === 'he') document.documentElement.dir = 'rtl';
    } catch(e) { /* fallback to English */ }

    window.addEventListener('online', function() {
      setTimeout(function() { window.location.reload(); }, 500);
    });
  </script>
</body>
</html>
