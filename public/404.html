<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ZenFlow</title>
    <!--
      GH Pages SPA fallback (rafgraph/spa-github-pages pattern).
      Any 404 on a deep route (/orb, /habits, /diary, /settings) redirects
      here; this snippet rewrites the URL to / with the intended path
      encoded in a single-use query so index.html can restore it.
    -->
    <script>
      (function () {
        var appBasePaths = ["/people-first-app/v2", "/people-first-app"];
        var l = window.location;
        var appBasePath = "/people-first-app";
        for (var i = 0; i < appBasePaths.length; i += 1) {
          var candidate = appBasePaths[i];
          if (l.pathname === candidate || l.pathname.indexOf(candidate + "/") === 0) {
            appBasePath = candidate;
            break;
          }
        }
        var routePath = "/";
        if (l.pathname.indexOf(appBasePath + "/") === 0) {
          routePath = l.pathname.slice(appBasePath.length) || "/";
        }
        try {
          sessionStorage.setItem("zenflow:spa-redirect", routePath + l.search + l.hash);
        } catch (error) {}
        window.location.replace(appBasePath + "/");
      })();
    </script>
  </head>
  <body></body>
</html>
