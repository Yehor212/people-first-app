<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6b52"/>
      <stop offset="50%" stop-color="#2a9d6e"/>
      <stop offset="100%" stop-color="#3dbd80"/>
    </linearGradient>

    <!-- Radial highlight for depth -->
    <radialGradient id="bgHighlight" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom shadow for dimension -->
    <radialGradient id="bgShadow" cx="65%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0a3d2e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a3d2e" stop-opacity="0"/>
    </radialGradient>

    <!-- Leaf glow -->
    <radialGradient id="leafGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Leaf fill gradient -->
    <linearGradient id="leafFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Subtle inner border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop shadow for leaf -->
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#0a3d2e" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feOffset dx="2" dy="4" result="offsetShadow"/>
      <feMerge>
        <feMergeNode in="offsetShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>

  <!-- Depth: highlight top-left -->
  <circle cx="256" cy="256" r="240" fill="url(#bgHighlight)"/>

  <!-- Depth: shadow bottom-right -->
  <circle cx="256" cy="256" r="240" fill="url(#bgShadow)"/>

  <!-- Subtle inner border -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Glow behind leaf -->
  <ellipse cx="256" cy="240" rx="130" ry="130" fill="url(#leafGlow)"/>

  <!-- Leaf icon with fill + stroke + shadow -->
  <g transform="translate(106, 96) scale(12.5)" filter="url(#leafShadow)">
    <!-- Leaf body filled -->
    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"
          fill="url(#leafFill)" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stem -->
    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"
          fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tiny sparkle accent -->
  <circle cx="340" cy="140" r="3" fill="white" opacity="0.4"/>
  <circle cx="345" cy="135" r="1.5" fill="white" opacity="0.6"/>
</svg>
