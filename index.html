    <!-- Permissions-Policy — explicit deny for APIs this app does not use.
         `gyroscope=(self)` is the ONE exception (useCosmicParallax on mobile).

         Safari/Firefox ignore); header-level injection is preferred on
         non-static hosts — kept here for defense-in-depth on GH Pages.
         Source: MDN Permissions-Policy (2026). -->
