# Ruflow+ repo-local example configuration.
# This is intentionally an example file, not an automatic override of any existing Codex config.
# Merge selectively into your actual Codex configuration if desired.

[ruflow_plus]
mode = "hierarchical"
auto_activate = "always"
head_role = "coordinator"
max_workers_medium = 3
max_workers_large = 5
require_written_plan = true
require_verification = true
require_learning_writeback = true
preflight_template = "docs/ai/PREFLIGHT_OPERATOR_TEMPLATE.md"
min_preflight_depth = "L2"
require_platform_matrix = true
require_anti_pattern_scan = true
require_go_stop_ask = true
verify_time_sensitive_externals = true
prefer_official_sources = true

[ruflow_plus.routing]
simple_request = "solo_lightweight"
repo_touching_request = "guided"
cross_domain_request = "ruflow_plus"
release_hardening = "ruflow_plus"

[ruflow_plus.anti_drift]
topology = "hierarchical"
specialist_roles_only = true
disjoint_write_sets = true
checkpoint_after_research = true
checkpoint_before_completion = true

[ruflow_plus.memory]
record_template = "docs/ai/RUFLOW_PLUS_LEARNING_RECORD.md"
write_on_bugfix = true
write_on_arch_decision = true
write_on_new_pattern = true
write_on_failed_attempt = true

[zenflow_context]
auto = true
mcp_server = "zenflow-context"
current_pack = ".Codex/auto-context/current.md"
max_chars = 8500
session_start = true
user_prompt_submit = true
subagent_start = true

[ruflow_plus.roles]
coordinator = "scope, planning, sequencing, integration"
researcher = "repo and web evidence gathering"
implementer = "bounded code changes in a narrow write set"
reviewer = "regressions, missing tests, policy and safety checks"
memory_keeper = "distill reusable patterns and routing hints"
