// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
        classpath 'androidx.baselineprofile:androidx.baselineprofile.gradle.plugin:1.4.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }

    configurations.classpath {
        resolutionStrategy {
            // Security floors verified by Snyk all-projects scan (2026-06-13).
            force 'io.netty:netty-buffer:4.1.135.Final'
            force 'io.netty:netty-codec:4.1.135.Final'
            force 'io.netty:netty-codec-http:4.1.135.Final'
            force 'io.netty:netty-codec-http2:4.1.135.Final'
            force 'io.netty:netty-codec-socks:4.1.135.Final'
            force 'io.netty:netty-common:4.1.135.Final'
            force 'io.netty:netty-handler:4.1.135.Final'
            force 'io.netty:netty-handler-proxy:4.1.135.Final'
            force 'io.netty:netty-resolver:4.1.135.Final'
            force 'io.netty:netty-transport:4.1.135.Final'
            force 'io.netty:netty-transport-native-unix-common:4.1.135.Final'
            force 'io.opentelemetry:opentelemetry-api:1.62.0'
        }
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { project ->
    afterEvaluate {
        if (project.plugins.hasPlugin('com.android.application') ||
            project.plugins.hasPlugin('com.android.library')) {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_21
                targetCompatibility JavaVersion.VERSION_21
            }
        }

        // Set Kotlin JVM target to match Java 21
        if (project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
            project.android.kotlinOptions {
                jvmTarget = '21'
            }
        }
    }

    // Force compatible dependency versions for AGP 8.13.0 / Capacitor 8
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.17.0'
            force 'androidx.core:core-ktx:1.17.0'
            force 'androidx.activity:activity:1.11.0'
            force 'androidx.activity:activity-ktx:1.11.0'
            force 'androidx.core:core-splashscreen:1.2.0'
            force 'androidx.appcompat:appcompat:1.7.1'
            force 'androidx.fragment:fragment:1.8.9'
            force 'androidx.fragment:fragment-ktx:1.8.9'

            // Security floors verified by Snyk all-projects scan (2026-06-13).
            force 'com.google.protobuf:protobuf-java:3.25.5'
            force 'com.google.protobuf:protobuf-javalite:3.25.5'
            force 'com.google.guava:guava:32.0.0-android'
            force 'io.netty:netty-buffer:4.1.135.Final'
            force 'io.netty:netty-codec:4.1.135.Final'
            force 'io.netty:netty-codec-http:4.1.135.Final'
            force 'io.netty:netty-codec-http2:4.1.135.Final'
            force 'io.netty:netty-codec-socks:4.1.135.Final'
            force 'io.netty:netty-common:4.1.135.Final'
            force 'io.netty:netty-handler:4.1.135.Final'
            force 'io.netty:netty-handler-proxy:4.1.135.Final'
            force 'io.netty:netty-resolver:4.1.135.Final'
            force 'io.netty:netty-transport:4.1.135.Final'
            force 'io.netty:netty-transport-native-unix-common:4.1.135.Final'
            force 'io.opentelemetry:opentelemetry-api:1.62.0'
            force 'org.bouncycastle:bcpg-jdk18on:1.84'
            force 'org.bouncycastle:bcpkix-jdk18on:1.84'
            force 'org.bouncycastle:bcprov-jdk18on:1.84'
            force 'org.bouncycastle:bcutil-jdk18on:1.84'
            force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
            force 'org.jetbrains.kotlin:kotlin-stdlib-common:2.2.20'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.20'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
