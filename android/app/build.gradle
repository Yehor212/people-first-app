apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'androidx.baselineprofile'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def ZENFLOW_ADMOB_ANDROID_SAMPLE_APP_IDS = [
        "ca-app-pub-3940256099942544~3347511713",
        "ca-app-pub-3940256099942544~1458002511",
] as Set

def zenflowAdMobAndroidAppId = project.findProperty("ZENFLOW_ADMOB_ANDROID_APP_ID")
        ?: System.getenv("ZENFLOW_ADMOB_ANDROID_APP_ID")
        ?: System.getenv("VITE_ADMOB_APP_ID_ANDROID")
        ?: "ca-app-pub-3940256099942544~3347511713"

// Only distributable app tasks require owner-bound production identifiers.
// The Baseline Profile plugin's nonMinifiedRelease/benchmarkRelease variants
// are profiling fixtures and are never eligible for upload.
def ZENFLOW_RELEASE_DISTRIBUTION_TASKS = [
        'assembleRelease',
        'bundleRelease',
        'installRelease',
        'packageRelease',
] as Set

def ZENFLOW_RELEASE_SIGNING_PROPERTY_KEYS = [
        'storeFile',
        'storePassword',
        'keyAlias',
        'keyPassword',
] as Set

def zenflowGoogleServicesFile = file('google-services.json')
def zenflowGoogleServicesConfigured = zenflowGoogleServicesFile.isFile()
        && zenflowGoogleServicesFile.length() > 0

def zenflowReleaseSigningValuesPresent = keystorePropertiesFile.exists()
        && ZENFLOW_RELEASE_SIGNING_PROPERTY_KEYS.every { key ->
            def value = keystoreProperties.getProperty(key)
            value != null && !value.trim().isEmpty()
        }
def zenflowReleaseStoreFile = zenflowReleaseSigningValuesPresent
        ? file(keystoreProperties.getProperty('storeFile'))
        : null
def zenflowReleaseSigningConfigured = zenflowReleaseSigningValuesPresent
        && zenflowReleaseStoreFile.isFile()

gradle.taskGraph.whenReady { taskGraph ->
    def releaseBuildRequested = taskGraph.allTasks.any { task ->
        task.project.path == ':app' && ZENFLOW_RELEASE_DISTRIBUTION_TASKS.contains(task.name)
    }

    if (releaseBuildRequested && (!zenflowAdMobAndroidAppId || ZENFLOW_ADMOB_ANDROID_SAMPLE_APP_IDS.contains(zenflowAdMobAndroidAppId))) {
        throw new GradleException("Release builds require ZENFLOW_ADMOB_ANDROID_APP_ID or VITE_ADMOB_APP_ID_ANDROID with the real Android AdMob app id; Google sample app ids are only allowed for debug/dev builds.")
    }
    if (releaseBuildRequested && !zenflowGoogleServicesConfigured) {
        throw new GradleException("Distributable release builds require the owner-provided android/app/google-services.json; Firebase/push configuration cannot be omitted or synthesized.")
    }
    if (releaseBuildRequested && !zenflowReleaseSigningConfigured) {
        throw new GradleException("Distributable release builds require android/key.properties with complete upload-signing inputs and an existing keystore file.")
    }
}

android {
    namespace = "com.zenflow.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.zenflow.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 35
        versionName "2.1.0"
        manifestPlaceholders = [
                adMobApplicationId: zenflowAdMobAndroidAppId
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (zenflowReleaseSigningConfigured) {
                storeFile zenflowReleaseStoreFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (zenflowReleaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.all {
    resolutionStrategy {
        // Force compatible version of androidx.browser for AGP 8.13.0 / compileSdk 36
        force 'androidx.browser:browser:1.9.0'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    // Google Play In-App Review
    implementation 'com.google.android.play:review:2.0.2'

    // Google Play In-App Updates
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    // Required for Firebase Sessions (need 1.1.x for Firebase BOM 33.x)
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'

    // Generated from release-equivalent Macrobenchmark journeys. The producer
    // stays separate so a hand-authored or empty profile cannot masquerade as proof.
    baselineProfile project(':baselineprofile')
}

apply from: 'capacitor.build.gradle'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

if (zenflowGoogleServicesConfigured) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
