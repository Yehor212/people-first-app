import java.util.Locale

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def zenflowAdMobAndroidAppId = project.findProperty("ZENFLOW_ADMOB_ANDROID_APP_ID")
        ?: System.getenv("ZENFLOW_ADMOB_ANDROID_APP_ID")
        ?: System.getenv("VITE_ADMOB_APP_ID_ANDROID")
        ?: ""

def zenflowAdMobAndroidBannerId = project.findProperty("VITE_ADMOB_BANNER_ID_ANDROID")
        ?: System.getenv("VITE_ADMOB_BANNER_ID_ANDROID")
        ?: ""

def zenflowAppAdsFile = rootProject.file("../public/app-ads.txt")
def zenflowExpectedAdMobPublisher = zenflowAppAdsFile.exists()
        ? (zenflowAppAdsFile.text =~ /google\.com, (pub-\d{16}), DIRECT,/).with { matcher -> matcher.find() ? matcher.group(1) : "" }
        : ""
def zenflowConfiguredAdMobPublisher = (zenflowAdMobAndroidAppId =~ /ca-app-(pub-\d{16})~\d+/).with { matcher -> matcher.matches() ? matcher.group(1) : "" }
def zenflowConfiguredAdMobBannerPublisher = (zenflowAdMobAndroidBannerId =~ /ca-app-(pub-\d{16})\/\d+/).with { matcher -> matcher.matches() ? matcher.group(1) : "" }

gradle.taskGraph.whenReady { taskGraph ->
    def debugPackagingTaskNames = [
            "assembledebug",
            "bundledebug",
            "packagedebug",
    ] as Set
    def publishableReleaseTaskNames = [
            "assemblerelease",
            "bundlerelease",
            "packagerelease",
    ] as Set
    def publishableReleaseTaskRequested = gradle.startParameter.taskNames.any { requestedTask ->
        publishableReleaseTaskNames.contains(requestedTask.tokenize(":").last().toLowerCase(Locale.ROOT))
    } || taskGraph.getAllTasks().any { task ->
        task.project == project && publishableReleaseTaskNames.contains(task.name.toLowerCase(Locale.ROOT))
    }
    def debugPackagingTaskRequested = gradle.startParameter.taskNames.any { requestedTask ->
        debugPackagingTaskNames.contains(requestedTask.tokenize(":").last().toLowerCase(Locale.ROOT))
    } || taskGraph.getAllTasks().any { task ->
        task.project == project && debugPackagingTaskNames.contains(task.name.toLowerCase(Locale.ROOT))
    }

    // Owner-less debug builds (CI/local without secrets) get the debug-only
    // sample id via src/debug/res; a provided-but-wrong id still fails fast.
    if (debugPackagingTaskRequested && zenflowAdMobAndroidAppId != "" && (!zenflowConfiguredAdMobPublisher || zenflowConfiguredAdMobPublisher != zenflowExpectedAdMobPublisher)) {
        throw new GradleException("Debug builds require ZENFLOW_ADMOB_ANDROID_APP_ID or VITE_ADMOB_APP_ID_ANDROID with a real app id matching public/app-ads.txt.")
    }

    if (publishableReleaseTaskRequested && (!zenflowConfiguredAdMobPublisher || zenflowConfiguredAdMobPublisher != zenflowExpectedAdMobPublisher)) {
        throw new GradleException("Release builds require ZENFLOW_ADMOB_ANDROID_APP_ID or VITE_ADMOB_APP_ID_ANDROID with a real app id matching public/app-ads.txt.")
    }
    if (publishableReleaseTaskRequested && (!zenflowConfiguredAdMobBannerPublisher || zenflowConfiguredAdMobBannerPublisher != zenflowExpectedAdMobPublisher)) {
        throw new GradleException("Release builds require VITE_ADMOB_BANNER_ID_ANDROID with a real banner id matching public/app-ads.txt.")
    }
}

android {
    namespace = "com.zenflow.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.zenflow.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 39
        versionName "2.1.2"
        manifestPlaceholders = [
                adMobApplicationId: zenflowAdMobAndroidAppId
        ]
        buildConfigField "boolean", "ZENFLOW_ANDROID_MOTION_BENCHMARK", "false"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Google Mobile Ads initializes from a ContentProvider before the
            // WebView starts. A valid sample application id keeps owner-less
            // debug APKs launchable; ad requests remain disabled in JS unless
            // the explicit admob-qa Vite mode is built.
            manifestPlaceholders = [
                    adMobApplicationId: "@string/zenflow_debug_admob_application_id"
            ]
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        benchmark {
            initWith release
            minifyEnabled true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            buildConfigField "boolean", "ZENFLOW_ANDROID_MOTION_BENCHMARK", "true"
        }
    }
    buildFeatures {
        buildConfig = true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.all {
    resolutionStrategy {
        // Force compatible version of androidx.browser for AGP 8.13.0 / compileSdk 36
        force 'androidx.browser:browser:1.9.0'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    // Google Play In-App Review
    implementation 'com.google.android.play:review:2.0.2'

    // Google Play In-App Updates
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    // Required for Firebase Sessions (need 1.1.x for Firebase BOM 33.x)
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
}

apply from: 'capacitor.build.gradle'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
