[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  # Netlify restores node_modules before its automatic npm install. Skipping
  # lifecycle scripts there prevents patch-package from reapplying to cached
  # files; the clean npm ci build command above runs postinstall exactly once.
  NPM_FLAGS = "--ignore-scripts"

[[redirects]]
  from = "/people-first-app/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/people-first-app/version-check.js"
  to = "/version-check.js"
  status = 200

[[redirects]]
  from = "/people-first-app/runtime-perf-bootstrap.js"
  to = "/runtime-perf-bootstrap.js"
  status = 200

[[redirects]]
  from = "/people-first-app/registerSW.js"
  to = "/registerSW.js"
  status = 200

[[redirects]]
  from = "/people-first-app/sw.js"
  to = "/sw.js"
  status = 200

[[redirects]]
  from = "/people-first-app/version.json"
  to = "/version.json"
  status = 200

[[redirects]]
  from = "/people-first-app/manifest.webmanifest"
  to = "/manifest.webmanifest"
  status = 200

[[redirects]]
  from = "/people-first-app/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# P0 Fix: Prevent caching of index.html to avoid stale version issues
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(self), bluetooth=(), browsing-topics=(), camera=(), cross-origin-isolated=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(self), hid=(), idle-detection=(), interest-cohort=(), magnetometer=(), microphone=(self), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self' capacitor: https:; script-src 'self' capacitor:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: capacitor:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.zenflowapp.online wss://api.zenflowapp.online https://cdn.pixabay.com https://*.sentry.io https://*.ingest.sentry.io https://www.googleapis.com capacitor:; media-src 'self' https://cdn.pixabay.com blob: data: capacitor:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/people-first-app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
