name: Telegram Control Plane

on:
  #checkov:skip=CKV_GHA_7:This workflow is the validated Telegram control-plane dispatch interface by design.
  workflow_dispatch:
    inputs:
      job_id:
        description: Telegram control job id
        required: true
        type: string
      mode:
        description: Control mode
        required: true
        type: choice
        options:
          - status
          - plan
          - fix
          - review
          - test
          - security
          - deploy
          - rollback
      prompt:
        description: User prompt from Telegram
        required: false
        type: string
        default: ""
      base_ref:
        description: Base branch or ref
        required: false
        type: string
        default: main
      approval_policy:
        description: Telegram approval state
        required: false
        type: choice
        default: auto
        options:
          - auto
          - telegram-required
          - telegram-approved

permissions:
  contents: read


concurrency:
  group: telegram-control-${{ inputs.job_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  JOB_ID: ${{ inputs.job_id }}
  MODE: ${{ inputs.mode }}
  PROMPT: ${{ inputs.prompt }}
  BASE_REF: ${{ inputs.base_ref || 'main' }}
  APPROVAL_POLICY: ${{ inputs.approval_policy || 'auto' }}
  WORK_BRANCH: codex/telegram-${{ inputs.job_id }}
  HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
  TELEGRAM_CONTROL_CALLBACK_URL: ${{ secrets.TELEGRAM_CONTROL_CALLBACK_URL }}
  TELEGRAM_CONTROL_CALLBACK_SECRET: ${{ secrets.TELEGRAM_CONTROL_CALLBACK_SECRET }}

jobs:
  control:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate trusted base ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BASE_REF" != "main" ] && [ "$BASE_REF" != "refs/heads/main" ]; then
            echo "Only main is trusted for Telegram Control checkout."
            exit 1
          fi

      - name: Checkout base ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.BASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare callback helper
        shell: bash
        run: |
          cat > /tmp/telegram-control-notify.sh <<'SCRIPT'
          notify_control() {
            local status="$1"
            local evidence="$2"
            local pr_url="${3:-}"
            local run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -z "${TELEGRAM_CONTROL_CALLBACK_URL:-}" ] || [ -z "${TELEGRAM_CONTROL_CALLBACK_SECRET:-}" ]; then
              echo "Telegram callback skipped: TELEGRAM_CONTROL_CALLBACK_URL or TELEGRAM_CONTROL_CALLBACK_SECRET is not configured."
              return 0
            fi
            jq -n \
              --arg job_id "$JOB_ID" \
              --arg status "$status" \
              --arg github_run_url "$run_url" \
              --arg branch "$WORK_BRANCH" \
              --arg pr_url "$pr_url" \
              --arg evidence "$evidence" \
              '{job_id:$job_id,status:$status,github_run_url:$github_run_url,branch:$branch,pr_url:$pr_url,evidence:[$evidence]}' \
              | curl -fsS \
                -H "Content-Type: application/json" \
                -H "X-Zenflow-Control-Secret: ${TELEGRAM_CONTROL_CALLBACK_SECRET}" \
                --data-binary @- \
                "${TELEGRAM_CONTROL_CALLBACK_URL}"
          }
          SCRIPT
          chmod +x /tmp/telegram-control-notify.sh

      - name: Validate control request
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/telegram-control-notify.sh

          case "$MODE" in
            status|plan|fix|review|test|security|deploy|rollback) ;;
            *)
              notify_control "failed" "Invalid mode: $MODE"
              echo "Invalid mode: $MODE" >&2
              exit 1
              ;;
          esac

          if [[ ! "$WORK_BRANCH" =~ ^codex/telegram-[A-Za-z0-9_.-]+$ ]]; then
            notify_control "failed" "Unsafe generated branch name: $WORK_BRANCH"
            echo "Unsafe generated branch name: $WORK_BRANCH" >&2
            exit 1
          fi

          if [ "$MODE" = "deploy" ] || [ "$MODE" = "rollback" ]; then
            if [ "$APPROVAL_POLICY" != "telegram-approved" ]; then
              notify_control "failed" "Destructive mode requires Telegram approval."
              echo "Destructive mode requires Telegram approval." >&2
              exit 1
            fi
          fi

          if [ "$BASE_REF" = "main" ] || [ "$BASE_REF" = "refs/heads/main" ]; then
            echo "Base ref is main; writes still go only to $WORK_BRANCH."
          fi

      - name: Prepare prompt metadata
        id: prompt_meta
        shell: bash
        run: |
          set -euo pipefail
          prompt_sha="$(printf '%s' "$PROMPT" | sha256sum | awk '{print $1}')"
          prompt_bytes="$(printf '%s' "$PROMPT" | wc -c | tr -d ' ')"
          echo "sha=$prompt_sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$prompt_bytes" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create isolated work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zenflow-telegram-control"
          git config user.email "zenflow-telegram-control@users.noreply.github.com"
          git checkout -B "$WORK_BRANCH"

      - name: Status mode
        if: ${{ inputs.mode == 'status' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . /tmp/telegram-control-notify.sh
          gh run list --limit 10
          notify_control "succeeded" "Status mode listed recent workflow runs."

      - name: Run requested test gates
        if: ${{ inputs.mode == 'test' || inputs.mode == 'deploy' || inputs.mode == 'rollback' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run check:task-completion
          npm run check:sync-contract
          if [ "$MODE" = "deploy" ] || [ "$MODE" = "rollback" ]; then
            npm run check:all
          fi

      - name: Create rollback proposal PR
        id: rollback_pr
        if: ${{ inputs.mode == 'rollback' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . /tmp/telegram-control-notify.sh

          rollback_target="$(printf '%s\n' "$PROMPT" | sed -nE 's/.*\b(target|to|ref|commit)[=: ]+([A-Za-z0-9._\/-]+).*/\2/p' | head -n 1)"
          if [ -z "$rollback_target" ]; then
            first_token="$(printf '%s\n' "$PROMPT" | awk '{print $1}')"
            second_token="$(printf '%s\n' "$PROMPT" | awk '{print $2}')"
            rollback_word="roll"back
            rollback_slash_command="/"$rollback_word
            if [ "$first_token" = "$rollback_slash_command" ] || [ "$first_token" = "$rollback_word" ]; then
              rollback_target="$second_token"
            else
              rollback_target="$first_token"
            fi
          fi

          if [[ ! "$rollback_target" =~ ^[A-Za-z0-9._/-]{7,80}$ ]] || [[ "$rollback_target" == -* ]]; then
            notify_control "UNVERIFIED" "Rollback target missing or unsafe. Use /rollback target=<commit-or-ref>."
            echo "UNVERIFIED: rollback target missing or unsafe. Use /rollback target=<commit-or-ref>." >&2
            exit 1
          fi

          if ! git rev-parse --verify "${rollback_target}^{commit}" >/dev/null 2>&1; then
            notify_control "UNVERIFIED" "Rollback target was not found as a commit: ${rollback_target}"
            echo "UNVERIFIED: rollback target was not found as a commit." >&2
            exit 1
          fi

          git checkout -B "$WORK_BRANCH"
          if ! git revert --no-edit "$rollback_target"; then
            git revert --abort || true
            notify_control "UNVERIFIED" "Rollback revert had conflicts for target ${rollback_target}; manual PR required."
            echo "UNVERIFIED: rollback revert had conflicts for target ${rollback_target}; manual PR required." >&2
            exit 1
          fi

          npm run typecheck
          npm run lint
          npm run check:task-completion
          npm run check:sync-contract

          gh auth setup-git
          git push --force-with-lease origin "$WORK_BRANCH"
          pr_url="$(gh pr create \
            --draft \
            --base "$BASE_REF" \
            --head "$WORK_BRANCH" \
            --title "Telegram rollback: ${rollback_target} (${JOB_ID})" \
            --body "Created by Telegram Control Plane rollback job ${JOB_ID}.\n\nTarget: ${rollback_target}\n\nPrompt SHA256: ${{ steps.prompt_meta.outputs.sha }}\nPrompt bytes: ${{ steps.prompt_meta.outputs.bytes }}\n\nThis is a draft rollback PR. It does not deploy or write directly to main.")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          notify_control "succeeded" "Created rollback draft PR for ${rollback_target}." "$pr_url"

      - name: Dispatch production deploy workflow
        id: deploy_dispatch
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . /tmp/telegram-control-notify.sh

          if [ "$BASE_REF" != "main" ] && [ "$BASE_REF" != "refs/heads/main" ]; then
            notify_control "UNVERIFIED" "Production deploy requires base_ref=main; refusing deploy from ${BASE_REF}."
            echo "UNVERIFIED: production deploy requires base_ref=main; refusing deploy from ${BASE_REF}." >&2
            exit 1
          fi

          if ! gh workflow run deploy.yml \
            --ref main \
            -f telegram_control_job_id="$JOB_ID" \
            -f telegram_approval=telegram-approved; then
            notify_control "UNVERIFIED" "GitHub Pages deploy workflow dispatch failed."
            echo "UNVERIFIED: GitHub Pages deploy workflow dispatch failed." >&2
            exit 1
          fi

          sleep 8
          deploy_run_json="$(gh run list --workflow deploy.yml --branch main --limit 1 --json databaseId,url,status,conclusion,createdAt 2>/dev/null || true)"
          deploy_run_url="$(printf '%s' "$deploy_run_json" | jq -r '.[0].url // empty')"
          if [ -n "$deploy_run_url" ]; then
            echo "deploy_run_url=$deploy_run_url" >> "$GITHUB_OUTPUT"
            notify_control "queued" "GitHub Pages deploy workflow dispatched." "$deploy_run_url"
          else
            notify_control "queued" "GitHub Pages deploy workflow dispatched; run URL not available yet."
          fi

      - name: Optional Snyk code scan
        if: ${{ inputs.mode == 'security' }}
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          snyk_secret_name="$(printf '%s_%s' SNYK TOKEN)"
          if [ -z "${!snyk_secret_name:-}" ]; then
            echo "UNVERIFIED: SNYK_TOKEN is not configured; skipping snyk code test."
            exit 0
          fi
          npx snyk code test

      - name: Create no-paid AI fallback report
        if: ${{ (inputs.mode == 'plan' || inputs.mode == 'fix' || inputs.mode == 'review' || inputs.mode == 'security') && env.HAS_OPENAI_API_KEY != 'true' }}
        shell: bash
        env:
          PROMPT_SHA: ${{ steps.prompt_meta.outputs.sha }}
          PROMPT_BYTES: ${{ steps.prompt_meta.outputs.bytes }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --import tsx tools/telegram-control/scripts/no-paid-ai-fallback.ts

      - name: Guard OpenAI API availability
        if: ${{ inputs.mode == 'plan' || inputs.mode == 'fix' || inputs.mode == 'review' || inputs.mode == 'security' }}
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/telegram-control-notify.sh
          if [ "$HAS_OPENAI_API_KEY" != "true" ]; then
            notify_control "UNVERIFIED" "No-paid RAG context report created; OPENAI_API_KEY is missing; Codex action was not run."
            echo "UNVERIFIED: No-paid RAG context report created; OPENAI_API_KEY is missing; Codex action was not run."
            exit 0
          fi

      - name: Run Codex
        id: run_codex
        if: ${{ (inputs.mode == 'plan' || inputs.mode == 'fix' || inputs.mode == 'review' || inputs.mode == 'security') && env.HAS_OPENAI_API_KEY == 'true' }}
        uses: openai/codex-action@23cb67af8fc4ecba6f6dd5cdc61e1800176aca61 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          output-file: artifacts/telegram-control-codex-final.md
          prompt: |
            You are operating ZenFlow through the Telegram Control Plane.

            Mode: ${{ inputs.mode }}
            Base ref: ${{ inputs.base_ref }}
            Job id: ${{ inputs.job_id }}
            Telegram prompt:
            ${{ inputs.prompt }}

            Hard constraints:
            - Work only on branch `codex/telegram-${{ inputs.job_id }}`.
            - Do not write directly to `main`.
            - Do not expose secrets or user journal/habit content.
            - Do not copy the raw Telegram prompt into PR bodies, artifacts, logs, or comments; use only a redacted summary or prompt hash.
            - Follow `AGENTS.md`, `ARCHITECTURE.md`, and `docs/ai/TASK_COMPLETION_PROTOCOL.md`.
            - For destructive changes, stop and report `ASK`; production deploy, rollback, Supabase SQL/RLS, secrets, protected docs/hooks, and branch deletion require Telegram confirmation.
            - Evidence must use current command output or current file paths. No evidence equals FAIL.

            Required output:
            - Summary of actions.
            - Evidence commands run and their result.
            - Whether the result is PASS, PARTIAL, UNVERIFIED, FAIL, or ASK.

      - name: Run post-Codex safety gates
        if: ${{ (inputs.mode == 'fix' || inputs.mode == 'security') && env.HAS_OPENAI_API_KEY == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npm run check:task-completion
          npm run check:sync-contract

      - name: Publish branch and PR
        id: publish
        if: ${{ (inputs.mode == 'plan' || inputs.mode == 'fix' || inputs.mode == 'review' || inputs.mode == 'security') && env.HAS_OPENAI_API_KEY == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . /tmp/telegram-control-notify.sh
          mkdir -p artifacts
          git status --short
          stage_paths=(
            AGENTS.md
            ARCHITECTURE.md
            CHANGELOG.md
            README.md
            SECURITY.md
            CONTRIBUTING.md
            package.json
            package-lock.json
            src
            docs
            e2e
            test
            scripts
            tools
            public
            supabase
            config
            .github
            android
            ios
            src-tauri
          )
          for path in "${stage_paths[@]}"; do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done
          git reset -- artifacts output coverage dist node_modules .mcp.json .mcp.local.json .claude/settings.local.json || true
          if git diff --cached --name-only | grep -E '(^|/)(\.env|\.env\..*|\.mcp\.json|\.mcp\.local\.json|google-services\.json|GoogleService-Info\.plist|.*\.keystore|.*\.jks|\.claude/settings\.local\.json)$' >/dev/null; then
            echo "::error title=Sensitive staged path::A forbidden sensitive/local file was staged."
            git diff --cached --name-only
            exit 1
          fi
          if git diff --cached --unified=0 | grep -E -q '(ghp_|github_pat_|sbp_|ctx7sk-|sk-[A-Za-z0-9_-]{20,}|Authorization:[[:space:]]*Bearer[[:space:]]+)'; then
            echo "::error title=Secret-like staged diff::A secret-like token was detected in the staged diff."
            exit 1
          fi
          if git diff --cached --quiet; then
            notify_control "succeeded" "No repository changes were produced by Codex."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "telegram control batch ${JOB_ID}"
          gh auth setup-git
          git push --force-with-lease origin "$WORK_BRANCH"

          pr_url="$(gh pr create \
            --draft \
            --base "$BASE_REF" \
            --head "$WORK_BRANCH" \
            --title "Telegram control: ${MODE} ${JOB_ID}" \
            --body "Created by Telegram Control Plane job ${JOB_ID}.\n\nMode: ${MODE}\n\nPrompt SHA256: ${{ steps.prompt_meta.outputs.sha }}\nPrompt bytes: ${{ steps.prompt_meta.outputs.bytes }}")"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          notify_control "succeeded" "Created Telegram control PR." "$pr_url"

      - name: Final callback for non-Codex modes
        if: ${{ inputs.mode == 'status' || inputs.mode == 'test' }}
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/telegram-control-notify.sh
          notify_control "succeeded" "${MODE} gates completed."

      - name: Scan control artifacts before upload
        id: control_artifact_scan
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d artifacts ]; then
            exit 0
          fi
          if find artifacts -type f -name ".*" -print -quit | grep -q .; then
            echo "::error title=Hidden control artifact::Unexpected hidden file in control artifacts."
            find artifacts -type f -name ".*" -print
            exit 1
          fi
          if grep -R -I -n -E '(ghp_|github_pat_|sbp_|ctx7sk-|sk-[A-Za-z0-9_-]{20,}|Authorization:[[:space:]]*Bearer[[:space:]]+|access_token=|refresh_token=|BEGIN [A-Z ]*PRIVATE KEY)' artifacts; then
            echo "::error title=Sensitive control artifact::Secret-like content detected before upload."
            exit 1
          fi

      - name: Upload control artifacts
        if: ${{ !cancelled() && steps.control_artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: telegram-control-${{ inputs.job_id }}
          path: artifacts
          if-no-files-found: ignore
          retention-days: 7
