name: Hyperfocus AI audit unit boundary

on:
  pull_request:
    paths:
      - "scripts/audio_audit/**"
      - "config/audio/hyperfocus-ai-models-v2.json"
      - "config/audio/hyperfocus-semantic-audit-v2.json"
      - "config/audio/hyperfocus-visible-regression-v1.json"
      - "docs/audio/hyperfocus-ai-audit-operator.md"
      - ".github/workflows/hyperfocus-ai-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperfocus-ai-audit-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/audio_audit/requirements-core.txt
      - name: Install hash-locked core audit dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r scripts/audio_audit/requirements-core.txt
      - name: Run read-only audit unit boundary
        run: python -m unittest discover -s scripts/audio_audit/tests -v
