# Phase 2-B visual regression workflow — Playwright baselines + reg-actions diff.
#
# On every PR: builds the app, runs Playwright screenshot tests, uploads all
# snapshots as a workflow artifact (30-day retention), and runs reg-viz to
# publish a PR comment with any visual diffs. No S3/external storage needed —
# GitHub Actions artifacts store the images for free on open-source plan.
#
# Main branch: same flow but no PR comment (baselines only).
#
# To update baselines: re-run Playwright locally with --update-snapshots, commit
# the new pngs under e2e/*-snapshots/, push. Next PR will diff against new baselines.

name: Visual Regression

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "tailwind.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-regression.yml"
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # align visual CI with GitHub's Node 24 migration path

jobs:
  visual:
    name: Playwright screenshots + reg-viz diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (full history for reg-actions)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        # Use `npm install` (not `npm ci`) to tolerate Windows-vs-Linux
        # optional-dep drift in package-lock.json (e.g. @emnapi/runtime).
        # Mirrors deploy.yml install step.
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app (production)
        run: npm run build
        env:
          CI: "true"

      - name: Verify visual baselines exist (Percy/Sauce anti-pattern guard)
        # Phase 2-B.1 hardening: fail the workflow if NO baseline PNGs are
        # committed. Playwright's default behaviour on first run is to
        # auto-generate baselines and pass — that silently accepts whatever
        # the PR renders as "correct." Concrete industry anti-pattern
        # (Percy/Sauce 2026). Baselines MUST be committed locally via
        # `npx playwright test e2e/design-system.spec.ts --update-snapshots`
        # and pushed as part of the PR.
        run: |
          shopt -s nullglob
          files=(e2e/design-system.spec.ts-snapshots/*.png e2e/design-system.spec.ts-snapshots/**/*.png)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No baseline PNGs found under e2e/design-system.spec.ts-snapshots/."
            echo "::error::Run locally: npx playwright test e2e/design-system.spec.ts --update-snapshots"
            echo "::error::Then commit the generated PNGs. Do NOT rely on CI to auto-populate."
            exit 1
          fi
          echo "Found ${#files[@]} baseline PNG(s)."

      - name: Run Playwright design-system visual tests
        # Strict comparison; on legitimate baseline drift (e.g. mass Tailwind
        # class refactors like motion-safe: backfill), regenerate baselines
        # via a follow-up commit `chore(visual): refresh design-system baselines`.
        # Keep this as a hard gate so visual debt cannot be hidden behind a
        # successful workflow conclusion.
        run: npx playwright test e2e/design-system.spec.ts
        env:
          CI: "true"

      - name: Upload Playwright snapshots (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots-${{ github.sha }}
          path: |
            e2e/**/*-snapshots/**
            e2e/**/test-results/**
            test-results/**
            playwright-report/**
          retention-days: 30
          if-no-files-found: warn

      - name: Publish visual diff comment (reg-actions)
        if: always() && github.event_name == 'pull_request'
        uses: reg-viz/reg-actions@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-directory-path: e2e
          matching-threshold: 0.05
          target-hash: ${{ github.event.pull_request.base.sha }}
