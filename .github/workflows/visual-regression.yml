# Phase 2-B visual regression workflow - Playwright baselines + artifact proof.
#
# On every PR: builds the app, runs Playwright screenshot tests, uploads all
# snapshots as a workflow artifact (30-day retention), and writes a GitHub
# step summary pointing reviewers at the diff artifact. No S3/external storage needed -
# GitHub Actions artifacts store the images for free on open-source plan.
#
# Main branch: same flow but no PR comment (baselines only).
#
# To update baselines: re-run Playwright locally with --update-snapshots, commit
# the new pngs under e2e/*-snapshots/, push. Next PR will diff against new baselines.

name: Visual Regression

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "tailwind.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-regression.yml"
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # align visual CI with GitHub's Node 24 migration path

jobs:
  visual:
    name: Playwright screenshots + artifact diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        # Mirrors deploy.yml install step so visual proof uses the same locked dependency graph.
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app (production)
        run: npm run build
        env:
          CI: "true"
          VITE_ENABLE_FACEBOOK_AUTH: ${{ vars.VITE_ENABLE_FACEBOOK_AUTH || 'true' }}
          VITE_FACEBOOK_PUBLIC_ACCESS_READY: ${{ vars.VITE_FACEBOOK_PUBLIC_ACCESS_READY || 'false' }}
          VITE_ENABLE_TELEGRAM_AUTH: ${{ vars.VITE_ENABLE_TELEGRAM_AUTH || 'true' }}
          VITE_ENABLE_APPLE_AUTH: ${{ vars.VITE_ENABLE_APPLE_AUTH || 'true' }}
          VITE_APPLE_PUBLIC_ACCESS_READY: ${{ vars.VITE_APPLE_PUBLIC_ACCESS_READY || 'false' }}

      - name: Verify visual baselines exist (Percy/Sauce anti-pattern guard)
        # Phase 2-B.1 hardening: fail the workflow if NO baseline PNGs are
        # committed. Playwright's default behaviour on first run is to
        # auto-generate baselines and pass — that silently accepts whatever
        # the PR renders as "correct." Concrete industry anti-pattern
        # (Percy/Sauce 2026). Baselines MUST be committed locally via
        # `npm run test:e2e:v2:visual -- --update-snapshots`
        # and pushed as part of the PR.
        run: |
          shopt -s nullglob
          design_files=(e2e/design-system.spec.ts-snapshots/*.png e2e/design-system.spec.ts-snapshots/**/*.png)
          nav_files=(e2e/nav-v2.spec.ts-snapshots/*.png e2e/nav-v2.spec.ts-snapshots/**/*.png)
          if [ ${#design_files[@]} -eq 0 ]; then
            echo "::error::No baseline PNGs found under e2e/design-system.spec.ts-snapshots/."
            echo "::error::Run locally: npm run test:e2e:v2:visual -- --update-snapshots"
            echo "::error::Then commit the generated PNGs. Do NOT rely on CI to auto-populate."
            exit 1
          fi
          if [ ${#nav_files[@]} -eq 0 ]; then
            echo "::error::No baseline PNGs found under e2e/nav-v2.spec.ts-snapshots/."
            echo "::error::Run locally: npm run test:e2e:v2:visual -- --update-snapshots"
            echo "::error::Then commit the generated PNGs. Do NOT rely on CI to auto-populate."
            exit 1
          fi
          files=("${design_files[@]}" "${nav_files[@]}")
          echo "Found ${#files[@]} baseline PNG(s)."

      - name: Run Playwright V2 visual tests
        # Strict comparison; on legitimate baseline drift (e.g. mass Tailwind
        # class refactors like motion-safe: backfill), regenerate baselines
        # via a follow-up commit `chore(visual): refresh design-system baselines`.
        # Keep this as a hard gate so visual debt cannot be hidden behind a
        # successful workflow conclusion.
        run: npm run test:e2e:v2:visual
        env:
          CI: "true"
          ZENFLOW_PLAYWRIGHT_USE_LOCAL_SERVER: "true"

      - name: Scan visual artifacts before upload
        id: visual_artifact_scan
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          paths=(
            e2e/**/*-snapshots/**
            e2e/**/test-results/**
            test-results/**
            playwright-report/**
          )
          existing=()
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then
              existing+=("$path")
            fi
          done
          if [ ${#existing[@]} -eq 0 ]; then
            exit 0
          fi
          # Playwright writes harmless run metadata under test-results; keep
          # the hidden-file guard strict for every other visual artifact.
          find test-results -type f -name ".last-run.json" -delete 2>/dev/null || true
          if find "${existing[@]}" -type f -name ".*" -print -quit | grep -q .; then
            echo "::error title=Hidden visual artifact::Unexpected hidden file in visual artifacts."
            find "${existing[@]}" -type f -name ".*" -print
            exit 1
          fi
          if grep -R -I -n -E '(ghp_|github_pat_|sbp_|ctx7sk-|sk-[A-Za-z0-9_-]{20,}|Authorization:[[:space:]]*Bearer[[:space:]]+|access_token=|refresh_token=|BEGIN [A-Z ]*PRIVATE KEY)' "${existing[@]}"; then
            echo "::error title=Sensitive visual artifact::Secret-like content detected before upload."
            exit 1
          fi

      - name: Upload Playwright snapshots
        if: ${{ !cancelled() && steps.visual_artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-snapshots-${{ github.sha }}
          path: |
            e2e/**/*-snapshots/**
            e2e/**/test-results/**
            test-results/**
            playwright-report/**
          retention-days: 30
          if-no-files-found: warn

      - name: Publish visual diff summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Visual Regression Evidence"
            echo ""
            echo "- Playwright snapshot tests are the blocking visual gate."
            echo "- Visual artifacts are uploaded as \`visual-snapshots-${GITHUB_SHA}\`."
            echo "- If this run failed, inspect \`test-results\` and \`playwright-report\` inside the artifact."
          } >> "$GITHUB_STEP_SUMMARY"
