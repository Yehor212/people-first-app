name: First-Party Audio Review Artifact

on:
  push:
    branches:
      - codex/first-party-audio-reconstruction-v5
    paths:
      - "scripts/audio-review/**"
      - "docs/audio/first-party-kimi-audio-reconstruction-spec.json"
      - "docs/superpowers/specs/2026-08-24-first-party-kimi-audio-reconstruction-design.md"
      - "docs/superpowers/plans/2026-08-24-first-party-kimi-audio-reconstruction.md"
      - ".github/workflows/first-party-audio-review.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: first-party-audio-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-pack:
    name: build-review-pack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg

      - name: Verify audio toolchain
        run: |
          node --version
          ffmpeg -version
          ffprobe -version

      - name: Run focused generator tests
        run: |
          node --expose-gc --test \
            scripts/audio-review/__tests__/generate-first-party-review-pack.test.mjs \
            scripts/audio-review/__tests__/first-party-audio-review-workflow.test.mjs

      - name: Generate full review pack
        run: |
          node --expose-gc scripts/audio-review/generate-first-party-review-pack.mjs \
            --output output/first-party-audio-review \
            > output/first-party-audio-review-build.json

      - name: Verify exact inventory and fail-closed release state
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");

          const root = path.resolve("output/first-party-audio-review");
          const verification = JSON.parse(
            fs.readFileSync(path.join(root, "evidence", "verification.json"), "utf8")
          );
          const rights = JSON.parse(
            fs.readFileSync(path.join(root, "evidence", "rights-ledger.json"), "utf8")
          );
          const mp3Files = [];
          const visit = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(fullPath);
              else if (entry.name.endsWith(".mp3")) mp3Files.push(fullPath);
            }
          };
          visit(path.join(root, "audio"));

          assert.equal(verification.status, "PASS");
          assert.equal(verification.assetCount, 26);
          assert.equal(verification.exactInventory, true);
          assert.equal(verification.runtimeModified, false);
          assert.equal(verification.humanListening, "UNVERIFIED");
          assert.deepEqual(new Set(Object.values(verification.platformPlayback)), new Set(["UNVERIFIED"]));
          assert.equal(rights.status, "REVIEW_ONLY");
          assert.equal(rights.releaseAuthorization, false);
          assert.equal(rights.assetCount, 26);
          assert.equal(mp3Files.length, 26);

          const sums = fs
            .readFileSync(path.join(root, "SHA256SUMS"), "utf8")
            .trim()
            .split(/\r?\n/);
          assert.equal(sums.length, 26);
          NODE

      - name: Create reproducible review ZIP
        run: |
          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          root = Path("output/first-party-audio-review")
          archive = Path("output/first-party-audio-review.zip")
          fixed_time = (2026, 8, 25, 0, 0, 0)
          files = sorted(path for path in root.rglob("*") if path.is_file())

          with ZipFile(archive, "w", compression=ZIP_DEFLATED, compresslevel=9) as output:
              for source in files:
                  relative = (Path(root.name) / source.relative_to(root)).as_posix()
                  info = ZipInfo(relative, date_time=fixed_time)
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  output.writestr(
                      info,
                      source.read_bytes(),
                      compress_type=ZIP_DEFLATED,
                      compresslevel=9,
                  )
          PY
          sha256sum output/first-party-audio-review.zip \
            > output/first-party-audio-review.zip.sha256
          test -s output/first-party-audio-review.zip
          test -s output/first-party-audio-review.zip.sha256

      - name: Upload hash-bound review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: first-party-audio-review-${{ github.sha }}
          path: |
            output/first-party-audio-review.zip
            output/first-party-audio-review.zip.sha256
            output/first-party-audio-review-build.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
