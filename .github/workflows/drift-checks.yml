name: Drift Checks

# PR and direct-main-push gate enforcing regression guards introduced in the
# 2026-04-18 tech-debt audit. Parallel matrix provides focused failure signals.
# Not a replacement for the full `ci:preflight` pipeline — complements it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      # Run only when something we can drift on actually changes.
      - 'src/**'
      - 'docs/**'
      - 'public/sounds/**'
      - 'docs/sounds/**'
      - 'docs/audio/**'
      - 'public/favicon*'
      - 'public/icon-*'
      - 'public/pwa-*'
      - 'public/apple-touch-icon.png'
      - 'public/manifest.webmanifest'
      - 'android/app/src/main/res/mipmap*/**'
      - 'android/app/src/main/res/values/ic_launcher_background.xml'
      - 'ios/App/App/Assets.xcassets/**'
      - 'src-tauri/icons/**'
      - 'config/brand-logo-assets.json'
      - 'AGENTS.md'
      - '.github/CODEOWNERS'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.codex/**'
      - 'tools/telegram-control/**'
      - 'tools/zenflow-context/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'ARCHITECTURE.md'
      - 'CLAUDE.md'
      - 'scripts/check-agent-context.mjs'
      - 'scripts/rag/**'
      - 'scripts/__tests__/rag-*.test.ts'
      - 'scripts/check-best-practices-gate.cjs'
      - 'scripts/generate-icons.cjs'
      - 'scripts/check-brand-logo-assets.cjs'
      - 'scripts/generate-brand-logo-proof-sheet.cjs'
      - 'scripts/generate-microsoft-store-logo-assets.cjs'
      - 'scripts/check-microsoft-store-logo-assets.cjs'
      - 'scripts/check-microsoft-store-msix-contract.cjs'
      - 'scripts/create-microsoft-store-msix.cjs'
      - 'scripts/check-no-ai-templates.cjs'
      - 'scripts/check-production-data-integrity.cjs'
      - 'scripts/production-data-integrity/**'
      - 'scripts/__tests__/production-data-integrity*.test.ts'
      - 'config/production-data-integrity*.json'
      - 'scripts/check-app-audio-assets.cjs'
      - 'scripts/__tests__/check-app-audio-assets.test.ts'
      - 'scripts/__tests__/no-ai-templates-policy.test.ts'
      - 'scripts/__tests__/best-practices-gate-contract.test.ts'
      - 'scripts/codex-governance/**'
      - 'scripts/doc-counts.cjs'
      - 'scripts/check-types-freshness.cjs'
      - 'scripts/check-supabase-migration-prefixes.cjs'
      - 'scripts/check-oss-licenses.cjs'
      - 'scripts/a11y-icons-audit.cjs'
      - '.github/workflows/drift-checks.yml'
      - '.github/workflows/production-data-integrity.yml'
      - '.github/workflows/telegram-control.yml'
  workflow_dispatch:

concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check.name == 'production-data-integrity' && 'drift-production-data-integrity' || matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: doc-counts
            cmd: node scripts/doc-counts.cjs --check
            fix: npm run doc-counts:update
          - name: types-freshness
            cmd: node scripts/check-types-freshness.cjs
            fix: npx supabase gen types typescript --project-id <id> > src/types/supabase.ts
          - name: supabase-migration-prefixes
            cmd: node scripts/check-supabase-migration-prefixes.cjs
            fix: create new migrations via `supabase migration new <name>` and avoid duplicate numeric prefixes in supabase/migrations
          - name: agent-context
            cmd: npm run check:agent-context
            fix: keep AGENTS.md tracked, CLAUDE.md as an AGENTS bridge, and ZenFlow Context profiles pointed at real headings
          - name: free-rag
            cmd: npm run check:rag
            fix: keep scripts/rag/corpus-manifest.json curated and rerun npm run rag:preflight for task-specific context
          - name: enforcement-health
            cmd: npm run enforcement:check
            fix: register missing blocking hooks or document intentional advisory-only enforcement
          - name: best-practices-gate
            cmd: npm run check:best-practices
            fix: restore docs/ai/BEST_PRACTICES_IMPLIED_REQUIREMENTS_GATE.md plus AGENTS, package, CI, release, and completion wiring
          - name: brand-logo-assets
            cmd: npm run assets:logos:check
            fix: run npm run assets:logos && npm run assets:logos:proof, then commit generated logo assets
          - name: desktop-store-logo-assets
            cmd: npm run desktop:store:check
            fix: run npm run desktop:store:assets and resolve Store logo/MSIX contract drift
          - name: no-ai-templates
            cmd: npm run check:no-ai-templates
            fix: restore docs/ai/NO_AI_TEMPLATES_AGENT_POLICY.md plus AGENTS, PR template, drift, agent-context, package, and checker wiring
          - name: production-data-integrity
            cmd: npm run check:production-data-integrity
            fix: restore the AST/reachability checker, exact ledgers, hook, CI workflow, policy, tests, and production demo/smoke boundaries
          - name: app-audio
            cmd: npm run check:app-audio
            fix: regenerate non-Hyperfocus audio, update provenance, and keep app audio inventories in sync
          - name: retry-tests
            cmd: npx vitest run src/lib/__tests__/retry.test.ts src/lib/__tests__/appUpdateManager.test.ts src/lib/__tests__/lazyWithRetry.test.ts
            fix: fix failing tests in src/lib/retry.ts (or migrated call-sites)
          - name: oss-licenses
            cmd: node scripts/check-oss-licenses.cjs
            fix: review new prod dep license; replace or add to EXCLUDE_PACKAGES with rationale
          # Ratchet mode (Law 27): current baseline is 2 icon-only buttons (HabitNotesSection,
          # JournalPhotoGallery) + 136 decorative-without-aria-hidden. CI blocks regression.
          # Tighten baselines as fixes land — the number can only go DOWN.
          - name: a11y-icons
            cmd: node scripts/a11y-icons-audit.cjs --max-icon-only=2 --max-decorative=136
            fix: add aria-label to icon-only buttons or aria-hidden="true" to decorative lucide icons
          - name: telegram-control
            cmd: npm run check:telegram-control
            fix: run npm run check:telegram-control locally, then fix Worker tests, workflow contract, smoke, or setup verifier output

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Full history so `git log -1 --format=%ct` returns committer-time
          # for check-types-freshness.cjs (see comment in that script).
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: Ensure app audio QC decoder
        if: runner.os == 'Linux' && matrix.check.name == 'app-audio'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}

      - name: On failure — suggest fix
        if: failure()
        run: |
          echo "::error title=${{ matrix.check.name }} failed::Fix suggestion: ${{ matrix.check.fix }}"
