name: Drift Checks

# PR-only gate enforcing regression guards introduced in the 2026-04-18 tech-debt
# audit. Each job is cheap (<30s). Parallel matrix for fail-fast signal.
# Not a replacement for the full `ci:preflight` pipeline — complements it.

on:
  pull_request:
    branches: [main]
    paths:
      # Run only when something we can drift on actually changes.
      - 'src/**'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/CODEOWNERS'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.claude/**'
      - 'tools/telegram-control/**'
      - 'tools/zenflow-context/**'
      - 'tools/ruflow-plus/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'ARCHITECTURE.md'
      - 'CLAUDE.md'
      - 'scripts/check-agent-context.mjs'
      - 'scripts/rag/**'
      - 'scripts/__tests__/rag-*.test.ts'
      - 'scripts/check-best-practices-gate.cjs'
      - 'scripts/__tests__/best-practices-gate-contract.test.ts'
      - 'scripts/check-subagent-teamlead-governance.mjs'
      - 'scripts/doc-counts.cjs'
      - 'scripts/check-types-freshness.cjs'
      - 'scripts/check-supabase-migration-prefixes.cjs'
      - 'scripts/check-oss-licenses.cjs'
      - 'scripts/a11y-icons-audit.cjs'
      - '.github/workflows/drift-checks.yml'
      - '.github/workflows/telegram-control.yml'
  workflow_dispatch:

concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: doc-counts
            cmd: node scripts/doc-counts.cjs --check
            fix: npm run doc-counts:update
          - name: types-freshness
            cmd: node scripts/check-types-freshness.cjs
            fix: npx supabase gen types typescript --project-id <id> > src/types/supabase.ts
          - name: supabase-migration-prefixes
            cmd: node scripts/check-supabase-migration-prefixes.cjs
            fix: create new migrations via `supabase migration new <name>` and avoid duplicate numeric prefixes in supabase/migrations
          - name: agent-context
            cmd: npm run check:agent-context
            fix: keep AGENTS.md tracked, CLAUDE.md as an AGENTS bridge, and ZenFlow Context profiles pointed at real headings
          - name: free-rag
            cmd: npm run check:rag
            fix: keep scripts/rag/corpus-manifest.json curated and rerun npm run rag:preflight for task-specific context
          - name: subagent-governance
            cmd: npm run check:subagent-governance
            fix: remove stale static test counts, fake mandatory Ruflo/tool claims, or untrusted subagent-output gaps
          - name: ruflow-plus
            cmd: npm run ai:ruflow-plus:check
            fix: run npm run ai:ruflow-plus:sync and commit regenerated tracked templates
          - name: enforcement-health
            cmd: npm run enforcement:check
            fix: register missing blocking hooks or document intentional advisory-only enforcement
          - name: best-practices-gate
            cmd: npm run check:best-practices
            fix: restore docs/ai/BEST_PRACTICES_IMPLIED_REQUIREMENTS_GATE.md plus AGENTS, package, CI, release, and completion wiring
          - name: retry-tests
            cmd: npx vitest run src/lib/__tests__/retry.test.ts src/lib/__tests__/appUpdateManager.test.ts src/lib/__tests__/lazyWithRetry.test.ts
            fix: fix failing tests in src/lib/retry.ts (or migrated call-sites)
          - name: oss-licenses
            cmd: node scripts/check-oss-licenses.cjs
            fix: review new prod dep license; replace or add to EXCLUDE_PACKAGES with rationale
          # Ratchet mode (Law 27): current baseline is 2 icon-only buttons (HabitNotesSection,
          # JournalPhotoGallery) + 136 decorative-without-aria-hidden. CI blocks regression.
          # Tighten baselines as fixes land — the number can only go DOWN.
          - name: a11y-icons
            cmd: node scripts/a11y-icons-audit.cjs --max-icon-only=2 --max-decorative=136
            fix: add aria-label to icon-only buttons or aria-hidden="true" to decorative lucide icons
          - name: telegram-control
            cmd: npm run check:telegram-control
            fix: run npm run check:telegram-control locally, then fix Worker tests, workflow contract, smoke, or setup verifier output

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so `git log -1 --format=%ct` returns committer-time
          # for check-types-freshness.cjs (see comment in that script).
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}

      - name: On failure — suggest fix
        if: failure()
        run: |
          echo "::error title=${{ matrix.check.name }} failed::Fix suggestion: ${{ matrix.check.fix }}"
