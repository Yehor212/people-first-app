name: Deploy V2 Preview to GitHub Pages

on:
  push:
    branches: ["codex/journal-v2-hub"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 preview branch
        uses: actions/checkout@v6
        with:
          path: v2-src

      - name: Checkout V1 main branch
        uses: actions/checkout@v6
        with:
          ref: main
          path: v1-src

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2-src/package-lock.json

      - name: Install V2 dependencies
        working-directory: v2-src
        run: npm install

      - name: Verify V2 preview shell
        working-directory: v2-src
        run: |
          npm run typecheck
          npm run lint
          npm run i18n:check
          npm run check:canonical-orbs
          npx vitest run src/components/navigation-v2/__tests__/ClassicPortalLink.test.tsx src/components/navigation-v2/__tests__/DrawerV2.test.tsx src/components/navigation-v2/__tests__/SidebarV2.test.tsx

      - name: Check Sentry readiness for V2 preview
        working-directory: v2-src
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          ZENFLOW_SENTRY_READINESS_REQUIRED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        run: npm run check:sentry-readiness
      - name: Smoke Sentry API for V2 preview
        working-directory: v2-src
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_BASE_URL: ${{ vars.SENTRY_BASE_URL }}
          ZENFLOW_SENTRY_API_REQUIRED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        run: npm run smoke:sentry-api

      - name: Build V2 preview under /v2
        working-directory: v2-src
        env:
          VITE_APP_BASE: /people-first-app/v2/
          VITE_FORCE_NAV_V2: "true"
          VITE_CLASSIC_BASE_URL: /people-first-app/
          VITE_DISABLE_PWA: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_FACEBOOK_AUTH: ${{ vars.VITE_ENABLE_FACEBOOK_AUTH || 'true' }}
          VITE_FACEBOOK_PUBLIC_ACCESS_READY: ${{ vars.VITE_FACEBOOK_PUBLIC_ACCESS_READY || 'false' }}
          VITE_ENABLE_TELEGRAM_AUTH: ${{ vars.VITE_ENABLE_TELEGRAM_AUTH || 'true' }}
          VITE_ENABLE_APPLE_AUTH: ${{ vars.VITE_ENABLE_APPLE_AUTH || 'true' }}
          VITE_APPLE_PUBLIC_ACCESS_READY: ${{ vars.VITE_APPLE_PUBLIC_ACCESS_READY || 'false' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npm run build

      - name: Check Sentry public artifacts for V2 preview
        working-directory: v2-src
        run: npm run check:sentry-artifacts

      - name: Install V1 dependencies
        working-directory: v1-src
        run: npm install

      - name: Check hosted auth providers for V2 preview
        working-directory: v1-src
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_EXPECTED_APPLE_CLIENT_ID: ${{ vars.SUPABASE_EXPECTED_APPLE_CLIENT_ID }}
          SUPABASE_EXPECTED_APPLE_ADDITIONAL_CLIENT_IDS: ${{ vars.SUPABASE_EXPECTED_APPLE_ADDITIONAL_CLIENT_IDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ZENFLOW_FACEBOOK_AUTH_PUBLIC_REQUIRED: ${{ secrets.VITE_SUPABASE_URL != '' && (secrets.VITE_SUPABASE_PUBLISHABLE_KEY != '' || secrets.VITE_SUPABASE_ANON_KEY != '') }}
          ZENFLOW_FACEBOOK_AUTH_LIVE_REQUIRED: ${{ vars.VITE_FACEBOOK_PUBLIC_ACCESS_READY == 'true' && 'true' || 'false' }}
          ZENFLOW_APPLE_AUTH_PUBLIC_REQUIRED: ${{ vars.VITE_APPLE_PUBLIC_ACCESS_READY == 'true' && secrets.VITE_SUPABASE_URL != '' && (secrets.VITE_SUPABASE_PUBLISHABLE_KEY != '' || secrets.VITE_SUPABASE_ANON_KEY != '') }}
          ZENFLOW_APPLE_AUTH_LIVE_REQUIRED: ${{ vars.VITE_APPLE_PUBLIC_ACCESS_READY == 'true' && 'true' || 'false' }}
          ZENFLOW_TELEGRAM_OIDC_LIVE_REQUIRED: true
          ZENFLOW_TELEGRAM_BOT_PROFILE_PHOTO_REQUIRED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          npm run check:facebook-auth-public
          npm run check:facebook-auth-live
          npm run check:apple-auth-public
          npm run check:apple-auth-live
          npm run check:telegram-oidc-live
          npm --prefix tools/telegram-control run check:bot-profile-photo

      - name: Check Sentry readiness for V1 public root
        working-directory: v1-src
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          ZENFLOW_SENTRY_READINESS_REQUIRED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        run: npm run check:sentry-readiness
      - name: Smoke Sentry API for V1 public root
        working-directory: v1-src
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_BASE_URL: ${{ vars.SENTRY_BASE_URL }}
          ZENFLOW_SENTRY_API_REQUIRED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        run: npm run smoke:sentry-api

      - name: Build V1 public root from main
        working-directory: v1-src
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_FACEBOOK_AUTH: ${{ vars.VITE_ENABLE_FACEBOOK_AUTH || 'true' }}
          VITE_FACEBOOK_PUBLIC_ACCESS_READY: ${{ vars.VITE_FACEBOOK_PUBLIC_ACCESS_READY || 'false' }}
          VITE_ENABLE_TELEGRAM_AUTH: ${{ vars.VITE_ENABLE_TELEGRAM_AUTH || 'true' }}
          VITE_ENABLE_APPLE_AUTH: ${{ vars.VITE_ENABLE_APPLE_AUTH || 'true' }}
          VITE_APPLE_PUBLIC_ACCESS_READY: ${{ vars.VITE_APPLE_PUBLIC_ACCESS_READY || 'false' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npm run build

      - name: Check Sentry public artifacts for V1 public root
        working-directory: v1-src
        run: npm run check:sentry-artifacts

      - name: Compose GitHub Pages artifact
        run: |
          mkdir -p pages
          cp -a v1-src/dist/. pages/
          rm -rf pages/v2
          mkdir -p pages/v2
          cp -a v2-src/dist/. pages/v2/
          for route in orb habits diary settings; do
            mkdir -p "pages/v2/${route}"
            cp pages/v2/index.html "pages/v2/${route}/index.html"
          done
          cp v2-src/dist/404.html pages/404.html
          touch pages/.nojekyll

      - name: Check final Sentry combined Pages artifact
        env:
          ZENFLOW_DIST_DIR: pages
        run: npm run check:sentry-artifacts

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    needs: build-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy combined V1 + V2 preview
        id: deployment
        uses: actions/deploy-pages@v5.0.0
        with:
          timeout: 600000
