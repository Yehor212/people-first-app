name: Production Data Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  production-data-integrity:
    name: production-data-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run adversarial checker contracts
        run: npx vitest run --configLoader runner scripts/__tests__/production-data-integrity.test.ts scripts/__tests__/production-data-integrity-hook.test.ts scripts/__tests__/production-data-integrity-workflow.test.ts

      - name: Prove source detector fails closed
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { spawnSync } = require("node:child_process");
          const canaryPath = "public/pdi-ci-source-canary.json";
          try {
            fs.writeFileSync(canaryPath, JSON.stringify([{
              id: "pdi-ci-canary-1",
              mood: "good",
              note: "CI detector canary",
              date: "2026-07-09",
              timestamp: 1783555200000,
            }]));
            const result = spawnSync(process.execPath, ["scripts/check-production-data-integrity.cjs", "--all", "--json"], { encoding: "utf8" });
            const report = JSON.parse(result.stdout);
            const exact = report.findings.some((finding) => finding.ruleId === "PDI002" && finding.path === canaryPath);
            if (result.status !== 1 || report.status !== "FAIL" || !exact) {
              throw new Error(`source canary was not rejected exactly: exit=${result.status} status=${report.status}`);
            }
          } finally {
            fs.rmSync(canaryPath, { force: true });
          }
          NODE

      - name: Check production source and enforcement contracts
        run: node scripts/check-production-data-integrity.cjs --all

      - name: Build production artifact
        run: npm run build

      - name: Prove bundle detector fails closed
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { spawnSync } = require("node:child_process");
          const canaryPath = "dist/assets/pdi-ci-bundle-canary.txt";
          try {
            fs.mkdirSync("dist/assets", { recursive: true });
            fs.writeFileSync(canaryPath, "ZENFLOW_TEST_FIXTURE_SENTINEL_7F4C9A2E");
            const result = spawnSync(process.execPath, ["scripts/check-production-data-integrity.cjs", "--all", "--bundle", "dist", "--json"], { encoding: "utf8" });
            const report = JSON.parse(result.stdout);
            const exact = report.findings.some((finding) => finding.ruleId === "PDI009" && finding.path === canaryPath);
            if (result.status !== 1 || report.status !== "FAIL" || !exact) {
              throw new Error(`bundle canary was not rejected exactly: exit=${result.status} status=${report.status}`);
            }
          } finally {
            fs.rmSync(canaryPath, { force: true });
          }
          NODE

      - name: Check production bundle canary
        run: node scripts/check-production-data-integrity.cjs --all --bundle dist
