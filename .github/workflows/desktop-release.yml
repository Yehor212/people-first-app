name: Desktop Windows Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-signed-release:
    permissions:
      contents: write
    environment:
      name: desktop-release-signing
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install dependencies
        run: npm ci

      - name: Check production data integrity
        run: npm run check:production-data-integrity

      - name: Validate desktop release source and tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_REF: ${{ github.ref }}
          DESKTOP_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:DESKTOP_RELEASE_REF -ne "refs/heads/main") {
            Write-Error "Desktop draft releases must be dispatched from refs/heads/main."
            exit 1
          }
          $version = node -p "require('./package.json').version"
          $tag = "desktop-v$version"
          gh release view $tag --repo "$env:DESKTOP_RELEASE_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release $tag already exists. Bump package.json version or delete the stale draft intentionally."
            exit 1
          }
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Tag $tag already exists. Bump package.json version before dispatching desktop release."
            exit 1
          }

      - name: Verify desktop toolchain
        run: npm run desktop:check

      - name: Build desktop app
        run: npm run desktop:build

      - name: Check desktop web bundle data integrity
        run: npm run check:production-data-integrity:bundle

      - name: Sign Windows artifacts
        env:
          ZENFLOW_WINDOWS_CERT_PFX_BASE64: ${{ secrets.ZENFLOW_WINDOWS_CERT_PFX_BASE64 }}
          ZENFLOW_WINDOWS_CERT_PASSWORD: ${{ secrets.ZENFLOW_WINDOWS_CERT_PASSWORD }}
          ZENFLOW_WINDOWS_TIMESTAMP_URL: ${{ vars.ZENFLOW_WINDOWS_TIMESTAMP_URL }}
        run: npm run desktop:sign

      - name: Verify signed release artifacts
        run: npm run desktop:release:check

      - name: Prepare release metadata
        id: meta
        shell: pwsh
        env:
          DESKTOP_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "desktop-v$version"
          $installer = "src-tauri/target/release/bundle/nsis/ZenFlow_${version}_x64-setup.exe"
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "url=https://github.com/$env:DESKTOP_RELEASE_REPOSITORY/releases/download/$tag/ZenFlow_${version}_x64-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          DESKTOP_RELEASE_INSTALLER: ${{ steps.meta.outputs.installer }}
          DESKTOP_RELEASE_SHA256: ${{ steps.meta.outputs.sha256 }}
          DESKTOP_RELEASE_URL: ${{ steps.meta.outputs.url }}
          DESKTOP_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $tag = $env:DESKTOP_RELEASE_TAG
          $installer = $env:DESKTOP_RELEASE_INSTALLER
          $sha = $env:DESKTOP_RELEASE_SHA256
          $url = $env:DESKTOP_RELEASE_URL
          $notes = @"
          ZenFlow Desktop Windows signed release.

          SHA-256: $sha
          Signed installer URL after publishing: $url

          After reviewing the draft release, set repository variables:
          - VITE_DESKTOP_SIGNED_RELEASE_URL=$url
          - VITE_DESKTOP_SIGNED_RELEASE_SHA256=$sha
          - VITE_DESKTOP_SIGNED_RELEASE_AUTHENTICODE=Valid
          "@
          gh release create $tag $installer --draft --title "ZenFlow Desktop $env:DESKTOP_RELEASE_VERSION" --notes $notes
