name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write

jobs:
  claude-review:
    # Run on PR events, or on @claude mentions in PR comments
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    env:
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip Claude review when API key is not configured
        if: ${{ env.HAS_ANTHROPIC_API_KEY != 'true' }}
        run: |
          echo "Claude review skipped: ANTHROPIC_API_KEY is not configured for this repository."

      - uses: anthropics/claude-code-action@78a7209fd893bd50d1b2b784da9b6f240a66373a # v1
        if: ${{ env.HAS_ANTHROPIC_API_KEY == 'true' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
