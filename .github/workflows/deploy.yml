name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  #checkov:skip=CKV_GHA_7:Manual dispatch inputs are validated Telegram approval signals, not build-output parameters.
  workflow_dispatch:
    inputs:
      telegram_control_job_id:
        description: Telegram control job id that approved this deploy
        required: false
        type: string
      telegram_approval:
        description: Deploy only when set by Telegram Control Plane after approval
        required: false
        type: choice
        default: manual-build-only
        options:
          - manual-build-only
          - telegram-approved

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # safety net for transitive actions still on Node 20

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Validate Telegram-approved deploy target
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_approval == 'telegram-approved'
        shell: bash
        env:
          TELEGRAM_CONTROL_JOB_ID: ${{ github.event.inputs.telegram_control_job_id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Telegram-approved production deploys must run from main."
            exit 1
          fi
          if [ -z "${TELEGRAM_CONTROL_JOB_ID:-}" ]; then
            echo "telegram_control_job_id is required for Telegram-approved deploys."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Type check
        run: npm run typecheck

      - name: Check i18n translations
        run: npm run i18n:check

      - name: Check deep i18n audit
        run: npm run i18n:deep

      - name: Check canonical orb visuals
        run: npm run check:canonical-orbs

      - name: Check task completion protocol
        run: npm run check:task-completion

      - name: Check best-practices implied requirements gate
        run: npm run check:best-practices

      - name: Ensure app audio QC decoder
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Check app audio asset contract
        run: npm run check:app-audio

      - name: Check Telegram-grade sync contract
        run: npm run check:sync-contract

      - name: Run release unit tests
        run: npm run test:release -- --maxWorkers=2

      - name: Run release workflow contract tests
        run: npm run test:release-contracts

      - name: Run focused release coverage report
        continue-on-error: true
        timeout-minutes: 8
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm run test:release -- --coverage \
            --coverage.thresholds.lines=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 \
            --coverage.thresholds.statements=0 \
            --maxWorkers=2

      - name: Check Sentry readiness
        if: github.event_name != 'pull_request'
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          ZENFLOW_SENTRY_READINESS_REQUIRED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        run: npm run check:sentry-readiness
      - name: Smoke Sentry API
        if: github.event_name != 'pull_request'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_BASE_URL: ${{ vars.SENTRY_BASE_URL }}
          ZENFLOW_SENTRY_API_REQUIRED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        run: npm run smoke:sentry-api

      - name: Check hosted auth providers
        if: github.event_name != 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_EXPECTED_APPLE_CLIENT_ID: ${{ vars.SUPABASE_EXPECTED_APPLE_CLIENT_ID }}
          SUPABASE_EXPECTED_APPLE_ADDITIONAL_CLIENT_IDS: ${{ vars.SUPABASE_EXPECTED_APPLE_ADDITIONAL_CLIENT_IDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_AUTH_BOT_TOKEN }}
          ZENFLOW_FACEBOOK_AUTH_PUBLIC_REQUIRED: ${{ secrets.VITE_SUPABASE_URL != '' && (secrets.VITE_SUPABASE_PUBLISHABLE_KEY != '' || secrets.VITE_SUPABASE_ANON_KEY != '') }}
          ZENFLOW_FACEBOOK_AUTH_LIVE_REQUIRED: ${{ vars.VITE_FACEBOOK_PUBLIC_ACCESS_READY == 'true' && 'true' || 'false' }}
          ZENFLOW_APPLE_AUTH_PUBLIC_REQUIRED: ${{ vars.VITE_APPLE_PUBLIC_ACCESS_READY == 'true' && secrets.VITE_SUPABASE_URL != '' && (secrets.VITE_SUPABASE_PUBLISHABLE_KEY != '' || secrets.VITE_SUPABASE_ANON_KEY != '') }}
          ZENFLOW_APPLE_AUTH_LIVE_REQUIRED: ${{ vars.VITE_APPLE_PUBLIC_ACCESS_READY == 'true' && 'true' || 'false' }}
          ZENFLOW_TELEGRAM_OIDC_LIVE_REQUIRED: true
          ZENFLOW_TELEGRAM_PUBLIC_BOT_PROFILE_PHOTO_REQUIRED: true
          ZENFLOW_TELEGRAM_BOT_PROFILE_PHOTO_REQUIRED: ${{ secrets.TELEGRAM_AUTH_BOT_TOKEN != '' }}
        run: |
          npm run check:facebook-auth-public
          npm run check:facebook-auth-live
          npm run check:apple-auth-public
          npm run check:apple-auth-live
          npm run check:telegram-oidc-live
          npm --prefix tools/telegram-control run check:public-bot-profile-photo
          npm --prefix tools/telegram-control run check:bot-profile-photo

      - name: Check Supabase publishable key readiness
        if: github.event_name != 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ZENFLOW_SUPABASE_PUBLISHABLE_REQUIRED: ${{ vars.ZENFLOW_SUPABASE_PUBLISHABLE_REQUIRED || 'false' }}
        run: npm run check:supabase-publishable-key

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_FACEBOOK_AUTH: ${{ vars.VITE_ENABLE_FACEBOOK_AUTH || 'true' }}
          VITE_FACEBOOK_PUBLIC_ACCESS_READY: ${{ vars.VITE_FACEBOOK_PUBLIC_ACCESS_READY || 'false' }}
          VITE_ENABLE_TELEGRAM_AUTH: ${{ vars.VITE_ENABLE_TELEGRAM_AUTH || 'true' }}
          VITE_ENABLE_APPLE_AUTH: ${{ vars.VITE_ENABLE_APPLE_AUTH || 'true' }}
          VITE_APPLE_PUBLIC_ACCESS_READY: ${{ vars.VITE_APPLE_PUBLIC_ACCESS_READY || 'false' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          VITE_DESKTOP_SIGNED_RELEASE_URL: ${{ vars.VITE_DESKTOP_SIGNED_RELEASE_URL }}
          VITE_DESKTOP_SIGNED_RELEASE_SHA256: ${{ vars.VITE_DESKTOP_SIGNED_RELEASE_SHA256 }}
          VITE_DESKTOP_SIGNED_RELEASE_AUTHENTICODE: ${{ vars.VITE_DESKTOP_SIGNED_RELEASE_AUTHENTICODE }}
        run: npm run build

      - name: Check Sentry public artifacts
        run: npm run check:sentry-artifacts

      # GitHub Pages serves direct URLs only when the path exists in the
      # artifact. Keep SPA fallback plus physical V2 route entrypoints so
      # /orb, /habits, /diary, /settings, and /desktop return 200 instead of 404.
      - name: Prepare GitHub Pages SPA artifact
        run: node scripts/prepare-pages-artifact.cjs

      - name: Check final Sentry public artifact
        env:
          ZENFLOW_DIST_DIR: dist
        run: npm run check:sentry-artifacts

      - name: Check final duplicate release artifacts
        run: npm run check:release-artifacts

      # Phase 0-A: size-limit enforces JS+CSS budget ceilings (ratchet complements this with floor).
      # Use the local check instead of the PR comparison action: the action mutates the checkout while
      # comparing against main, which can make later release proof steps run against stale base files.
      - name: Size limit (bundle budgets)
        run: npm run check:size -- --json

      - name: Stage Pages release artifact
        run: npm run stage:release-artifacts

      - name: Check staged Sentry public artifact
        env:
          ZENFLOW_DIST_DIR: output/pages-artifact.nosync
        run: npm run check:sentry-artifacts

      - name: Check staged release artifact integrity
        run: npm run check:staged-release-artifacts

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Telegram sync drill
        id: telegram-sync-drill
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SYNC_TEST_EMAIL: ${{ secrets.ZENFLOW_SYNC_TEST_EMAIL }}
          SYNC_TEST_PASSWORD: ${{ secrets.ZENFLOW_SYNC_TEST_PASSWORD }}
          ZENFLOW_TELEGRAM_SYNC_DRILL_OUTPUT: artifacts/telegram-sync-drill.json
          ZENFLOW_SYNC_DRILL_URL: http://127.0.0.1:4182/people-first-app/settings?nav=v2&navLayout=phone&syncHealth=1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SYNC_TEST_EMAIL_VALUE="${SYNC_TEST_EMAIL:-}"
          SYNC_TEST_PASSWORD_VALUE="${SYNC_TEST_PASSWORD:-}"
          unset SYNC_TEST_EMAIL SYNC_TEST_PASSWORD ZENFLOW_SYNC_TEST_EMAIL ZENFLOW_SYNC_TEST_PASSWORD
          npm run preview -- --host 127.0.0.1 --port 4182 --strictPort --outDir output/pages-artifact.nosync > artifacts/telegram-sync-drill-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS "http://127.0.0.1:4182/people-first-app/" > /dev/null; then
              break
            fi
            sleep 1
          done
          {
            echo "Staged sync drill target: $ZENFLOW_SYNC_DRILL_URL"
            curl -fsS "http://127.0.0.1:4182/people-first-app/" > /dev/null
            curl -fsS "$ZENFLOW_SYNC_DRILL_URL" > /dev/null
          } >> artifacts/telegram-sync-drill-preview.log 2>&1

          if [ -n "$SYNC_TEST_EMAIL_VALUE" ] && [ -n "$SYNC_TEST_PASSWORD_VALUE" ]; then
            ZENFLOW_TELEGRAM_SYNC_DRILL_REQUIRED=true \
            ZENFLOW_SYNC_TEST_EMAIL="$SYNC_TEST_EMAIL_VALUE" \
            ZENFLOW_SYNC_TEST_PASSWORD="$SYNC_TEST_PASSWORD_VALUE" \
              npm run smoke:telegram-sync-drill
          else
            npm run smoke:telegram-sync-drill
          fi

          if { [ -n "$SYNC_TEST_EMAIL_VALUE" ] && grep -R -F -q -- "$SYNC_TEST_EMAIL_VALUE" artifacts; } || \
             { [ -n "$SYNC_TEST_PASSWORD_VALUE" ] && grep -R -F -q -- "$SYNC_TEST_PASSWORD_VALUE" artifacts; }; then
            echo "Secret material leaked into uploaded sync drill artifacts."
            exit 1
          fi

      - name: Upload Telegram sync drill artifact
        if: ${{ !cancelled() && steps.telegram-sync-drill.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: telegram-sync-drill
          path: |
            artifacts/telegram-sync-drill.json
            artifacts/telegram-sync-drill-preview.log
          if-no-files-found: error

      - name: Run deploy smoke tests
        timeout-minutes: 8
        env:
          ZENFLOW_PLAYWRIGHT_USE_LOCAL_SERVER: true
        run: |
          if [ -d "e2e/visual-regression.spec.ts-snapshots" ]; then
            npx playwright test e2e/deploy-smoke.spec.ts --project=chromium
          else
            echo "No baseline snapshots found — generating baselines (first run)"
            npx playwright test e2e/deploy-smoke.spec.ts --project=chromium --update-snapshots || true
            echo "::warning::Visual regression baselines generated. Commit the snapshots directory to enable comparison."
          fi

      - name: Run staged deploy smoke tests
        timeout-minutes: 8
        env:
          ZENFLOW_PLAYWRIGHT_USE_LOCAL_SERVER: true
          ZENFLOW_PLAYWRIGHT_PREVIEW_DIR: output/pages-artifact.nosync
          ZENFLOW_PLAYWRIGHT_LOCAL_PORT: 4181
        run: npx playwright test e2e/deploy-smoke.spec.ts --project=chromium

      - name: Run staged PWA offline tests
        timeout-minutes: 10
        env:
          ZENFLOW_PWA_OFFLINE_PREVIEW_DIR: output/pages-artifact.nosync
          ZENFLOW_PWA_OFFLINE_SKIP_BUILD: true
        run: npm run test:e2e:v2:diary-pwa-offline -- --project=pwa-offline-chromium-phone

      - name: Run staged PWA audio range tests
        timeout-minutes: 10
        env:
          ZENFLOW_PWA_OFFLINE_PREVIEW_DIR: output/pages-artifact.nosync
          ZENFLOW_PWA_OFFLINE_SKIP_BUILD: true
        run: npm run test:e2e:v2:pwa-audio-range -- --project=pwa-offline-chromium-phone

      - name: Run staged V2 Orb performance tests
        timeout-minutes: 10
        env:
          CI: true
          ZENFLOW_PLAYWRIGHT_USE_LOCAL_SERVER: true
          ZENFLOW_PLAYWRIGHT_PREVIEW_DIR: output/pages-artifact.nosync
          ZENFLOW_PLAYWRIGHT_LOCAL_PORT: 4183
        run: npx playwright test e2e/orb-user-flow-performance.spec.ts --project=chromium --workers=1 --retries=0

      - name: Upload V2 Orb performance diagnostics
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v2-orb-performance-diagnostics
          path: |
            output/playwright/orb-user-flow-performance-2026-07-01/**
            test-results/orb-user-flow-performance-*/**
          if-no-files-found: warn

      - name: Run staged V2 visual regression tests
        timeout-minutes: 15
        env:
          CI: true
          ZENFLOW_PLAYWRIGHT_USE_LOCAL_SERVER: true
          ZENFLOW_PLAYWRIGHT_PREVIEW_DIR: output/pages-artifact.nosync
          ZENFLOW_PLAYWRIGHT_LOCAL_PORT: 4184
        run: npm run test:e2e:v2:visual

      # Keep broad governance debt visible without blocking the static Pages release path.
      # The deploy-specific gates above still block on lint, typecheck, i18n, unit tests,
      # build, canonical orbs, sync contract, sync drill, and focused V1/V2 smoke coverage.
      - name: Quality ratchet check
        continue-on-error: true
        run: npm run ratchet:check

      - name: Upload artifact
        if: github.event_name == 'push' || github.event.inputs.telegram_approval == 'telegram-approved'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: output/pages-artifact.nosync
          include-hidden-files: true
          # Preserve hidden files such as .nojekyll so GitHub Pages serves the SPA fallback correctly.
          # We need .nojekyll to disable Jekyll on GH Pages so 404.html SPA fallback ships.

  android-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: npm ci

      - name: Check Sentry readiness for Android web assets
        if: github.event_name != 'pull_request'
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          ZENFLOW_SENTRY_READINESS_REQUIRED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        run: npm run check:sentry-readiness
      - name: Smoke Sentry API for Android web assets
        if: github.event_name != 'pull_request'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_BASE_URL: ${{ vars.SENTRY_BASE_URL }}
          ZENFLOW_SENTRY_API_REQUIRED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        run: npm run smoke:sentry-api

      - name: Build Android web assets (required before cap sync)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_FACEBOOK_AUTH: ${{ vars.VITE_ENABLE_FACEBOOK_AUTH || 'true' }}
          VITE_FACEBOOK_PUBLIC_ACCESS_READY: ${{ vars.VITE_FACEBOOK_PUBLIC_ACCESS_READY || 'false' }}
          VITE_ENABLE_TELEGRAM_AUTH: ${{ vars.VITE_ENABLE_TELEGRAM_AUTH || 'true' }}
          VITE_ENABLE_APPLE_AUTH: ${{ vars.VITE_ENABLE_APPLE_AUTH || 'true' }}
          VITE_APPLE_PUBLIC_ACCESS_READY: ${{ vars.VITE_APPLE_PUBLIC_ACCESS_READY || 'false' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npm run build:android

      - name: Check Sentry public artifacts for Android web assets
        run: npm run check:sentry-artifacts

      - name: Check duplicate release artifacts for Android web assets
        run: npm run check:release-artifacts

      - name: Capacitor sync (generates cordova.variables.gradle)
        env:
          CAPACITOR_BUILD: "true"
        run: |
          npx cap sync android
          node scripts/capacitor-prune-assets.cjs
          node scripts/normalize-android-config.cjs

      - name: Check Android synced duplicate release artifacts
        run: npm run check:release-artifacts:android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Android assembleDebug
        run: cd android && ./gradlew assembleDebug --console=plain

      - name: Check Android packaged Hyperfocus audio
        run: npm run check:hyperfocus-audio:android-apk

      - name: Android testDebugUnitTest
        run: cd android && ./gradlew testDebugUnitTest --console=plain

      - name: Android lintDebug
        run: cd android && ./gradlew lintDebug --console=plain

      - name: Upload Android lint report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html

  ios-gate:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Check Sentry readiness for iOS web assets
        if: github.event_name != 'pull_request'
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          ZENFLOW_SENTRY_READINESS_REQUIRED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        run: npm run check:sentry-readiness
      - name: Smoke Sentry API for iOS web assets
        if: github.event_name != 'pull_request'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_BASE_URL: ${{ vars.SENTRY_BASE_URL }}
          ZENFLOW_SENTRY_API_REQUIRED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != '' }}
        run: npm run smoke:sentry-api

      - name: Build iOS web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_FACEBOOK_AUTH: ${{ vars.VITE_ENABLE_FACEBOOK_AUTH || 'true' }}
          VITE_FACEBOOK_PUBLIC_ACCESS_READY: ${{ vars.VITE_FACEBOOK_PUBLIC_ACCESS_READY || 'false' }}
          VITE_ENABLE_TELEGRAM_AUTH: ${{ vars.VITE_ENABLE_TELEGRAM_AUTH || 'true' }}
          VITE_ENABLE_APPLE_AUTH: ${{ vars.VITE_ENABLE_APPLE_AUTH || 'true' }}
          VITE_APPLE_PUBLIC_ACCESS_READY: ${{ vars.VITE_APPLE_PUBLIC_ACCESS_READY || 'false' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: npm run build:ios

      - name: Check Sentry public artifacts for iOS web assets
        run: npm run check:sentry-artifacts

      - name: Check duplicate release artifacts for iOS web assets
        run: npm run check:release-artifacts

      - name: Capacitor sync iOS
        env:
          CAPACITOR_BUILD: "true"
        run: |
          npx cap sync ios
          node scripts/capacitor-prune-assets.cjs
          node scripts/normalize-ios-config.cjs
          node scripts/normalize-ios-spm.cjs

      - name: Check iOS synced duplicate release artifacts
        run: npm run check:release-artifacts:ios

      - name: Resolve iOS packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Build iOS simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build

  deploy:
    if: github.event_name == 'push' || github.event.inputs.telegram_approval == 'telegram-approved'
    needs: [build, android-gate, ios-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 600000 # 10 minutes (max allowed)

  public-auth-smoke:
    if: github.event_name == 'push' || github.event.inputs.telegram_approval == 'telegram-approved'
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Smoke public auth providers
        env:
          ZENFLOW_PUBLIC_AUTH_URL: ${{ needs.deploy.outputs.page_url }}
          ZENFLOW_PUBLIC_AUTH_ADDITIONAL_PATHS: orb/?nav=v2&navLayout=phone,habits/?nav=v2&navLayout=phone,diary/?nav=v2&navLayout=phone,planning/?nav=v2&navLayout=phone,settings/?nav=v2&navLayout=phone
          FACEBOOK_READY: ${{ vars.VITE_FACEBOOK_PUBLIC_ACCESS_READY == 'true' && 'true' || 'false' }}
          APPLE_READY: ${{ vars.VITE_APPLE_PUBLIC_ACCESS_READY == 'true' && 'true' || 'false' }}
          ZENFLOW_PUBLIC_AUTH_BROWSER_CHANNEL: chrome
        shell: bash
        run: |
          set -euo pipefail
          expected_providers="google,telegram"
          click_providers="google,telegram"
          forbidden_providers=""

          if [ "$FACEBOOK_READY" = "true" ]; then
            expected_providers="google,facebook,telegram"
            click_providers="google,facebook,telegram"
          else
            forbidden_providers="facebook"
          fi

          if [ "$APPLE_READY" = "true" ]; then
            expected_providers="${expected_providers},apple"
            click_providers="${click_providers},apple"
          else
            forbidden_providers="${forbidden_providers:+${forbidden_providers},}apple"
          fi

          ZENFLOW_PUBLIC_AUTH_EXPECTED_PROVIDERS="$expected_providers" \
          ZENFLOW_PUBLIC_AUTH_FORBIDDEN_PROVIDERS="$forbidden_providers" \
          ZENFLOW_PUBLIC_AUTH_CLICK_PROVIDERS="$click_providers" \
            npm run smoke:public-auth
