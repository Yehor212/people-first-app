name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # safety net for transitive actions still on Node 20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=critical

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Type check
        run: npx tsc --noEmit

      - name: Check i18n translations
        run: npm run i18n:check

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          if [ -d "e2e/visual-regression.spec.ts-snapshots" ]; then
            npx playwright test --project=chromium
          else
            echo "No baseline snapshots found — generating baselines (first run)"
            npx playwright test --project=chromium --update-snapshots || true
            echo "::warning::Visual regression baselines generated. Commit the snapshots directory to enable comparison."
          fi

      - name: Quality ratchet check
        run: npm run ratchet:check

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: dist

  android-gate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4.8.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: npm ci

      - name: Build web assets (required before cap sync)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - name: Capacitor sync (generates cordova.variables.gradle)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Android assembleDebug
        run: cd android && ./gradlew assembleDebug --console=plain

      - name: Android testDebugUnitTest
        run: cd android && ./gradlew testDebugUnitTest --console=plain

      - name: Android lintDebug
        run: cd android && ./gradlew lintDebug --console=plain

      - name: Upload Android lint report
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html

  deploy:
    if: github.event_name == 'push'
    needs: [build]  # android-gate runs in parallel as informational check, does not block web deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
        with:
          timeout: 600000 # 10 minutes (max allowed)
