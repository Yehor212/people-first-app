name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # safety net for transitive actions still on Node 20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=critical

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: Type check
        run: npx tsc --noEmit

      - name: Check i18n translations
        run: npm run i18n:check

      - name: Check canonical orb visuals
        run: npm run check:canonical-orbs

      - name: Check Telegram-grade sync contract
        run: npm run check:sync-contract

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      # GitHub Pages serves direct URLs only when the path exists in the
      # artifact. Keep SPA fallback plus physical V2 route entrypoints so
      # /orb, /habits, /diary, and /settings return 200 instead of 404.
      - name: Prepare GitHub Pages SPA artifact
        run: node scripts/prepare-pages-artifact.cjs

      # Phase 0-A: size-limit enforces JS+CSS budget ceilings (ratchet complements this with floor).
      # PR-only: size-limit-action needs a PR to compare against main; on direct push to main it fails with
      # "No PR found" (action limitation). On push events, `npm run ratchet:check` below enforces the ceiling.
      - name: Size limit (bundle budgets) [PR only]
        if: github.event_name == 'pull_request'
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_step: install
          build_script: build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Telegram sync drill
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          ZENFLOW_SYNC_TEST_EMAIL: ${{ secrets.ZENFLOW_SYNC_TEST_EMAIL }}
          ZENFLOW_SYNC_TEST_PASSWORD: ${{ secrets.ZENFLOW_SYNC_TEST_PASSWORD }}
          ZENFLOW_TELEGRAM_SYNC_DRILL_OUTPUT: artifacts/telegram-sync-drill.json
        shell: bash
        run: |
          mkdir -p artifacts
          npm run preview -- --host 127.0.0.1 --port 4173 > artifacts/telegram-sync-drill-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT

          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/people-first-app/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/people-first-app/ > /dev/null

          if [ -n "$ZENFLOW_SYNC_TEST_EMAIL" ] && [ -n "$ZENFLOW_SYNC_TEST_PASSWORD" ]; then
            export ZENFLOW_TELEGRAM_SYNC_DRILL_REQUIRED=true
          fi
          export ZENFLOW_SYNC_DRILL_URL="http://127.0.0.1:4173/people-first-app/settings?nav=v2&navLayout=phone&syncHealth=1"
          npm run smoke:telegram-sync-drill

      - name: Upload Telegram sync drill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-sync-drill
          path: |
            artifacts/telegram-sync-drill.json
            artifacts/telegram-sync-drill-preview.log
          if-no-files-found: error

      - name: Run deploy smoke tests
        timeout-minutes: 8
        run: |
          if [ -d "e2e/visual-regression.spec.ts-snapshots" ]; then
            npx playwright test e2e/deploy-smoke.spec.ts --project=chromium
          else
            echo "No baseline snapshots found — generating baselines (first run)"
            npx playwright test e2e/deploy-smoke.spec.ts --project=chromium --update-snapshots || true
            echo "::warning::Visual regression baselines generated. Commit the snapshots directory to enable comparison."
          fi

      # Keep broad governance debt visible without blocking the static Pages release path.
      # The deploy-specific gates above still block on lint, typecheck, i18n, unit coverage,
      # build, and focused V1/V2 smoke coverage.
      - name: Quality ratchet check
        continue-on-error: true
        run: npm run ratchet:check

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist
          # v3.0.1 preserves hidden files in tar; v4 may filter dotfiles like .nojekyll.
          # We need .nojekyll to disable Jekyll on GH Pages so 404.html SPA fallback ships.

  android-gate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4.8.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: npm install

      - name: Build Android web assets (required before cap sync)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build:android

      - name: Capacitor sync (generates cordova.variables.gradle)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Android assembleDebug
        run: cd android && ./gradlew assembleDebug --console=plain

      - name: Android testDebugUnitTest
        run: cd android && ./gradlew testDebugUnitTest --console=plain

      - name: Android lintDebug
        run: cd android && ./gradlew lintDebug --console=plain

      - name: Upload Android lint report
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html

  ios-gate:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm install

      - name: Build iOS web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build:ios

      - name: Capacitor sync iOS
        run: npx cap sync ios && node scripts/normalize-ios-spm.cjs

      - name: Resolve iOS packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Build iOS simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build

  deploy:
    if: github.event_name == 'push'
    needs: [build] # android-gate and ios-gate run in parallel; web deploy waits only for web release gates
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
        with:
          timeout: 600000 # 10 minutes (max allowed)
