name: CC0 Kimi audio review package

on:
  pull_request:
    paths:
      - "scripts/audio_review/**"
      - "config/audio/cc0-kimi-audio-review-spec.json"
      - ".github/workflows/cc0-kimi-audio-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/audio_review/requirements.txt
      - name: Install pinned Python dependency and ffmpeg
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r scripts/audio_review/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Run review-tool tests
        run: python -m unittest discover -s scripts/audio_review/tests -v
      - name: Build review-only package
        env:
          SOURCE_DATE_EPOCH: "1787630400"
        run: python -m scripts.audio_review.build --spec config/audio/cc0-kimi-audio-review-spec.json --output output/cc0-kimi-audio-review --cache output/cc0-kimi-audio-cache
      - name: Independently verify package
        run: python -m scripts.audio_review.verify --spec config/audio/cc0-kimi-audio-review-spec.json --package output/cc0-kimi-audio-review
      - uses: actions/upload-artifact@v4
        with:
          name: cc0-kimi-audio-review
          path: output/cc0-kimi-audio-review
          if-no-files-found: error
          retention-days: 14
