name: CC0 Kimi Audio Review Artifact

on:
  push:
    branches:
      - codex/first-party-audio-reconstruction-v5
    paths:
      - .github/workflows/cc0-kimi-audio-review.yml
      - scripts/audio-review/generate-cc0-kimi-review-pack.mjs
      - scripts/audio-review/cc0-kimi-audio-config.mjs
      - scripts/audio-review/cc0-kimi-audio-core.mjs
      - scripts/audio-review/cc0-kimi-audio-ffmpeg.mjs
      - scripts/audio-review/CC0_KIMI_REVIEW_README.md
      - scripts/audio-review/__tests__/generate-cc0-kimi-review-pack.test.mjs
      - scripts/audio-review/__tests__/cc0-kimi-audio-review-workflow.test.mjs
      - docs/audio/cc0-kimi-audio-reconstruction-spec.json
      - docs/audio/cc0-kimi-audio-source-lock.json
      - docs/superpowers/specs/2026-08-25-cc0-kimi-audio-reconstruction-design.md
      - docs/superpowers/plans/2026-08-25-cc0-kimi-audio-reconstruction.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cc0-kimi-audio-review-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-review-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch tip
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Install audio tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg zip

      - name: Verify toolchain
        run: |
          node --version
          ffmpeg -version
          ffprobe -version

      - name: Run focused contracts
        run: |
          node --test \
            scripts/audio-review/__tests__/generate-cc0-kimi-review-pack.test.mjs \
            scripts/audio-review/__tests__/cc0-kimi-audio-review-workflow.test.mjs

      - name: Generate full review pack
        run: |
          mkdir -p output
          node scripts/audio-review/generate-cc0-kimi-review-pack.mjs \
            --output output/cc0-kimi-audio-review \
            --source-cache output/cc0-kimi-source-cache \
            > output/cc0-kimi-audio-review-build.json

      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: cc0-kimi-audio-failure-${{ github.sha }}
          path: |
            output/cc0-kimi-source-cache/2679.mp3
            output/cc0-kimi-source-cache/1019.mp3
            output/cc0-kimi-source-cache/1294.mp3
            output/cc0-kimi-audio-review/audio/hyperfocus/hyperfocus-rain-soft.mp3
            output/cc0-kimi-audio-review/audio/hyperfocus/hyperfocus-rain-deep.mp3
            output/cc0-kimi-audio-review/audio/hyperfocus/hyperfocus-rain-intense.mp3
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Verify inventory, source rights and fail-closed release state
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = "output/cc0-kimi-audio-review";
          const verification = JSON.parse(fs.readFileSync(path.join(root, "evidence/verification.json"), "utf8"));
          const rights = JSON.parse(fs.readFileSync(path.join(root, "evidence/rights-ledger.json"), "utf8"));
          const sources = JSON.parse(fs.readFileSync(path.join(root, "evidence/source-evidence.json"), "utf8"));
          const audio = [];
          for (const directory of ["audio/hyperfocus", "audio/ambience", "audio/feedback"]) {
            for (const file of fs.readdirSync(path.join(root, directory))) {
              if (file.endsWith(".mp3")) audio.push(path.join(directory, file));
            }
          }
          if (verification.status !== "PASS") throw new Error("objective verification did not pass");
          if (verification.sourceRightsDocumented !== true) throw new Error("source-rights evidence is incomplete");
          if (verification.releaseAuthorization !== false) throw new Error("release authorization must remain false");
          if (verification.assetCount !== 26 || verification.decodedQcCount !== 26 || !verification.exactInventory) throw new Error("exact 26-file inventory failed");
          if (verification.humanListening !== "UNVERIFIED") throw new Error("human listening must remain unverified");
          if (verification.runtimeModified !== false) throw new Error("runtimeModified must remain false");
          if (verification.familyDistinctness.status !== "PASS" || verification.familyDistinctness.maximumCorrelation >= 0.995) throw new Error("environment families are not sufficiently distinct");
          if (rights.sourceRightsDocumented !== true || rights.releaseAuthorization !== false || rights.formalLegalReview !== "UNVERIFIED") throw new Error("rights ledger is not fail-closed");
          if (Object.keys(sources.sources).length !== 17) throw new Error("source inventory must contain 17 exact recordings");
          if (audio.length !== 26) throw new Error(`expected 26 MP3 files, found ${audio.length}`);
          NODE
          git diff --exit-code -- public/sounds docs/sounds src/sw.ts android ios src-tauri

      - name: Generate spectrogram evidence
        shell: bash
        run: |
          set -euo pipefail
          root="output/cc0-kimi-audio-review"
          mkdir -p "$root/spectrograms"
          while IFS= read -r file; do
            base="$(basename "${file%.mp3}")"
            ffmpeg -hide_banner -loglevel error -i "$file" \
              -lavfi "showspectrumpic=s=1200x480:legend=1:color=intensity" \
              -frames:v 1 -y "$root/spectrograms/$base.png"
          done < <(find "$root/audio" -type f -name '*.mp3' | LC_ALL=C sort)
          test "$(find "$root/spectrograms" -type f -name '*.png' | wc -l)" -eq 26

      - name: Add exact reproducibility sources
        run: |
          root="output/cc0-kimi-audio-review/reproducibility"
          mkdir -p \
            "$root/scripts/audio-review/__tests__" \
            "$root/docs/audio" \
            "$root/docs/superpowers/specs" \
            "$root/docs/superpowers/plans" \
            "$root/.github/workflows"
          cp scripts/audio-review/generate-cc0-kimi-review-pack.mjs "$root/scripts/audio-review/"
          cp scripts/audio-review/cc0-kimi-audio-config.mjs "$root/scripts/audio-review/"
          cp scripts/audio-review/cc0-kimi-audio-core.mjs "$root/scripts/audio-review/"
          cp scripts/audio-review/cc0-kimi-audio-ffmpeg.mjs "$root/scripts/audio-review/"
          cp scripts/audio-review/CC0_KIMI_REVIEW_README.md "$root/scripts/audio-review/"
          cp scripts/audio-review/__tests__/generate-cc0-kimi-review-pack.test.mjs "$root/scripts/audio-review/__tests__/"
          cp scripts/audio-review/__tests__/cc0-kimi-audio-review-workflow.test.mjs "$root/scripts/audio-review/__tests__/"
          cp docs/audio/cc0-kimi-audio-reconstruction-spec.json "$root/docs/audio/"
          if [ -f docs/audio/cc0-kimi-audio-source-lock.json ]; then cp docs/audio/cc0-kimi-audio-source-lock.json "$root/docs/audio/"; fi
          cp docs/superpowers/specs/2026-08-25-cc0-kimi-audio-reconstruction-design.md "$root/docs/superpowers/specs/"
          cp docs/superpowers/plans/2026-08-25-cc0-kimi-audio-reconstruction.md "$root/docs/superpowers/plans/"
          cp .github/workflows/cc0-kimi-audio-review.yml "$root/.github/workflows/"

      - name: Create deterministic review archive
        shell: bash
        run: |
          set -euo pipefail
          root="output/cc0-kimi-audio-review"
          archive="output/cc0-kimi-audio-review-${GITHUB_SHA}.zip"
          find "$root" -exec touch -h -d '1980-01-01T00:00:00Z' {} +
          (
            cd output
            LC_ALL=C find cc0-kimi-audio-review -type f -print | LC_ALL=C sort | zip -X -q "$OLDPWD/$archive" -@
          )
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload hash-bound review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: cc0-kimi-audio-review-${{ github.sha }}
          path: |
            output/cc0-kimi-audio-review-${{ github.sha }}.zip
            output/cc0-kimi-audio-review-${{ github.sha }}.zip.sha256
            output/cc0-kimi-audio-review-build.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
